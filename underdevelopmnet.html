
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Maintenance Mode | Pro Developing</title>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <style>
            *{margin:0;padding:0;box-sizing:border-box}
            body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#1E3A8A 0%,#2563EB 100%);min-height:100vh;display:flex;align-items:center;justify-content:center}
            .maintenance-wrapper{text-align:center;padding:2rem;animation:fadeInUp 0.6s ease}
            @keyframes fadeInUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
            .maintenance-icon{font-size:80px;color:#fff;margin-bottom:2rem;animation:pulse 2s infinite}
            @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
            .maintenance-wrapper h1{font-size:clamp(2rem,5vw,3rem);color:#fff;margin-bottom:1rem;font-weight:800}
            .maintenance-wrapper p{font-size:clamp(0.9rem,2vw,1.1rem);color:rgba(255,255,255,0.9);max-width:600px;margin:0 auto 2rem;line-height:1.6}
            .progress-bar{width:300px;height:4px;background:rgba(255,255,255,0.2);border-radius:4px;margin:2rem auto;overflow:hidden}
            .progress{width:45%;height:100%;background:#fff;border-radius:4px;animation:loading 2s ease-in-out infinite}
            @keyframes loading{0%{width:0}50%{width:70%}100%{width:0}}
        </style>
    </head>
    <body>
        <div class="maintenance-wrapper">
            <div class="maintenance-icon"><i class="fas fa-tools"></i></div>
            <h1>We&#039;ll Be Back Soon!</h1>
            <p>Our website is currently undergoing scheduled maintenance. We apologize for the inconvenience. Please check back in a few hours.</p>
            <div class="progress-bar"><div class="progress"></div></div>
        </div>
    </body>
    </html>
