<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="Pro.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Developing | A4 Optimized Invoice</title>
    <style>
        :root {
            --primary: #3d5a80;
            --dark: #293241;
            --gray: #64748b;
        }

        /* A4 Setup */
        @page {
            size: A4;
            margin: 0;
        }

        body {
            background: #e2e8f0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact;
        }

        /* Main A4 Container */
        .a4-container {
            width: 210mm;
            min-height: 297mm;
            padding: 20mm;
            margin: 20px auto;
            background: white;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            box-sizing: border-box;
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .logo-section img {
            width: 160px;
            margin-bottom: 10px;
        }

        .office-info {
            font-size: 13px;
            color: var(--gray);
            line-height: 1.4;
        }

        .invoice-banner-box {
            text-align: right;
        }

        .banner {
            background: var(--primary);
            color: white;
            font-size: 38px;
            font-weight: 900;
            padding: 8px 30px;
            border-left: 10px solid var(--dark);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .meta {
            margin-top: 15px;
            font-size: 14px;
        }

        .meta input {
            border: none;
            text-align: right;
            font-weight: bold;
            width: 100px;
        }

        /* Billing */
        .billing-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-top: 2px solid var(--primary);
            padding-top: 20px;
            margin-bottom: 30px;
        }

        .label {
            font-weight: bold;
            color: var(--primary);
            font-size: 12px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 5px;
        }

        .bill-input {
            width: 90%;
            border: none;
            border-bottom: 1px solid transparent;
            padding: 2px 0;
            font-size: 14px;
        }

        .bill-input:focus {
            outline: none;
            background: #f8fafc;
            border-bottom-color: var(--primary);
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f1f5f9;
            color: var(--primary);
            text-align: left;
            padding: 12px;
            font-size: 13px;
            border-bottom: 2px solid var(--primary);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .row-input {
            width: 100%;
            border: none;
            font-size: 14px;
        }

        .num-in {
            width: 60px;
            text-align: right;
            border: 1px solid #ddd;
            padding: 4px;
            border-radius: 4px;
        }

        /* Totals */
        .summary-box {
            margin-top: 30px;
            display: flex;
            justify-content: flex-end;
        }

        .total-table {
            width: 280px;
        }

        .total-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
        }

        .grand-total {
            background: var(--primary);
            color: white;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }

        /* Controls */
        .controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-add { background: #10b981; color: white; }
        .btn-print { background: var(--dark); color: white; }

        @media print {
            body { background: white; }
            .a4-container { margin: 0; box-shadow: none; width: 100%; }
            .controls, .btn-del { display: none !important; }
            .num-in { border: none; }
        }
    </style>
</head>
<body>

<div class="a4-container" id="invoice">
    <div class="header">
        <div class="logo-section">
            <img src="Propng.png" alt="Pro Developing">
            <div class="office-info">
                <strong>Pro Developing</strong><br>
                Vav-tharad 385565<br>
                +91 6356952788
            </div>
        </div>
        <div class="invoice-banner-box">
            <div class="banner">INVOICE</div>
            <div class="meta">
                <b>No:</b> <input type="text" value="PRO-01"><br>
                <b>Date:</b> <input type="text" id="dateText">
            </div>
        </div>
    </div>

    <div class="billing-grid">
        <div>
            <span class="label">Bill From</span>
            <strong>Pro Developing</strong><br>
            Vav-tharad, Gujarat<br>
            Contact: 6356952788
        </div>
        <div>
            <span class="label">Bill To</span>
            <input type="text" class="bill-input" placeholder="Client Name" style="font-weight:bold"><br>
            <input type="text" class="bill-input" placeholder="Address Line 1"><br>
            <input type="text" class="bill-input" placeholder="Phone Number">
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th width="40%">Item Description</th>
                <th style="text-align:right">Qty</th>
                <th style="text-align:right">Rate</th>
                <th style="text-align:right">Tax%</th>
                <th style="text-align:right">Total</th>
                <th class="btn-del" width="30"></th>
            </tr>
        </thead>
        <tbody id="itemsBody">
            </tbody>
    </table>

    <div class="summary-box">
        <div class="total-table">
            <div class="total-item">
                <span>Subtotal</span>
                <span>₹<span id="subTotal">0.00</span></span>
            </div>
            <div class="total-item">
                <span>Tax</span>
                <span>₹<span id="taxTotal">0.00</span></span>
            </div>
            <div class="grand-total">
                <span>Total</span>
                <span>₹<span id="grandTotal">0.00</span></span>
            </div>
        </div>
    </div>
</div>

<div class="controls">
    <button class="btn btn-add" onclick="addRow()">+ Add Item</button>
    <button class="btn btn-print" onclick="window.print()">Print Invoice</button>
</div>

<script>
    document.getElementById('dateText').value = new Date().toLocaleDateString();

    function addRow() {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><input type="text" class="row-input" value="Consulting Service"></td>
            <td style="text-align:right"><input type="number" class="num-in qty" value="1" oninput="calc()"></td>
            <td style="text-align:right"><input type="number" class="num-in rate" value="0" oninput="calc()"></td>
            <td style="text-align:right"><input type="number" class="num-in tax" value="0" oninput="calc()"></td>
            <td style="text-align:right; font-weight:bold">₹<span class="row-amt">0.00</span></td>
            <td class="btn-del"><button onclick="this.parentElement.parentElement.remove();calc()" style="color:red; border:none; background:none; cursor:pointer">✕</button></td>
        `;
        document.getElementById('itemsBody').appendChild(tr);
        calc();
    }

    function calc() {
        let sub = 0, tax = 0;
        document.querySelectorAll('#itemsBody tr').forEach(row => {
            const q = parseFloat(row.querySelector('.qty').value) || 0;
            const r = parseFloat(row.querySelector('.rate').value) || 0;
            const t = parseFloat(row.querySelector('.tax').value) || 0;
            
            const base = q * r;
            const taxAmt = base * (t / 100);
            const total = base + taxAmt;
            
            row.querySelector('.row-amt').innerText = total.toFixed(2);
            sub += base;
            tax += taxAmt;
        });
        
        document.getElementById('subTotal').innerText = sub.toFixed(2);
        document.getElementById('taxTotal').innerText = tax.toFixed(2);
        document.getElementById('grandTotal').innerText = (sub + tax).toFixed(2);
    }

    // Default 3 rows
    window.onload = () => { addRow(); addRow(); addRow(); };
</script>

</body>
</html>
