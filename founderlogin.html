<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRO FOUNDER · vault</title>
  <!-- modern font & emailjs -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 30%, #1a3f35, #0b241f);
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      padding: 1rem;
      margin: 0;
      position: relative;
    }

    /* subtle animated glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 70% 20%, rgba(64, 224, 176, 0.15), transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      background: rgba(18, 40, 33, 0.75);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border: 1px solid rgba(64, 224, 176, 0.25);
      border-radius: 42px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(0, 255, 200, 0.1) inset;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      z-index: 2;
    }

    .card:hover {
      box-shadow: 0 40px 70px -8px #0b2f25, 0 0 0 1px #2b9b7a inset;
    }

    h2 {
      font-size: 2.1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #e6f7f0, #9fd9c6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 2rem;
      text-align: center;
      filter: drop-shadow(0 4px 6px #00000030);
    }

    .input-group {
      margin-bottom: 1.25rem;
    }

    input {
      width: 100%;
      padding: 1rem 1.5rem;
      border: none;
      border-radius: 60px;
      background: rgba(12, 30, 26, 0.7);
      box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.6), 0 0 0 1px #317a62;
      color: #e2f0ea;
      font-size: 1rem;
      font-weight: 500;
      outline: none;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }

    input:focus {
      box-shadow: inset 0 2px 10px #000000, 0 0 0 2px #3ccf9b;
      background: rgba(10, 35, 28, 0.9);
    }

    input::placeholder {
      color: #98b7ab;
      font-weight: 400;
      opacity: 0.7;
    }

    button {
      width: 100%;
      padding: 1rem 1.5rem;
      border: none;
      border-radius: 60px;
      background: linear-gradient(145deg, #1d7059, #155d48);
      color: white;
      font-weight: 600;
      font-size: 1.05rem;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 12px 24px -10px #0f352b, 0 4px 8px rgba(0, 0, 0, 0.4), 0 0 0 1px #41b38f inset;
      transition: all 0.2s ease;
      margin-top: 0.75rem;
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #259a78, #1f7e62);
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 0;
    }

    button:hover::after {
      opacity: 0.4;
    }

    button:active {
      transform: scale(0.98);
      box-shadow: 0 4px 12px #0b2d21;
    }

    button span {
      position: relative;
      z-index: 1;
    }

    .hidden {
      display: none !important;
    }

    #otpSection {
      margin-top: 1.5rem;
      animation: fadeUp 0.4s ease;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* subtle badge for security */
    .secure-badge {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1.8rem;
      color: #80b6a4;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.3px;
      opacity: 0.8;
    }

    .secure-badge span {
      background: rgba(30, 70, 58, 0.5);
      padding: 0.2rem 0.9rem;
      border-radius: 60px;
      border: 1px solid #306b58;
    }

    /* style for success screen links (injected later) */
    .link-btn {
      display: inline-block;
      padding: 0.9rem 2rem;
      margin: 0.4rem 0;
      background: rgba(23, 58, 48, 0.8);
      backdrop-filter: blur(8px);
      border: 1px solid #3a9b7e;
      border-radius: 60px;
      color: #caffe5;
      font-weight: 600;
      text-decoration: none;
      transition: 0.2s;
      width: 200px;
      box-shadow: 0 8px 16px -6px #0c2f21;
    }

    .link-btn:hover {
      background: #267a62;
      border-color: #98f0d2;
      color: white;
      transform: translateY(-2px);
    }

    /* success card (will inherit .card style) */
    .success-card {
      text-align: center;
    }

    .success-card h1 {
      font-size: 2.8rem;
      line-height: 1.2;
      margin-bottom: 0.5rem;
      background: linear-gradient(145deg, #f2fff9, #c4f0de);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .success-card p {
      color: #b2e0d0;
      margin-bottom: 2rem;
      font-size: 1.1rem;
    }

    /* responsive */
    @media (max-width: 460px) {
      .card { padding: 2rem 1.25rem; }
      h2 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

<div class="card">
  <h2>PRO FOUNDER</h2>
  
  <!-- founder pin field -->
  <div class="input-group">
    <input type="password" id="founderPin" placeholder="⚡ founder secret PIN" maxlength="6" autocomplete="off">
  </div>

  <!-- unlock button -->
  <button id="unlockBtn"><span>🔓 unlock vault</span></button>

  <!-- send OTP button (hidden initially) -->
  <button id="sendOtpBtn" class="hidden"><span>📨 send OTP to founder</span></button>

  <!-- OTP verification section (hidden initially) -->
  <div id="otpSection" class="hidden">
    <div class="input-group" style="margin-top: 0.5rem;">
      <input type="text" id="otpInput" placeholder="•••••• 6-digit OTP" maxlength="6">
    </div>
    <button id="verifyOtpBtn"><span>✓ verify & enter</span></button>
  </div>

  <!-- just a design detail -->
  <div class="secure-badge">
    <span>✦ end‑to‑encrypted ✦</span>
    <span>⚡ hardware vault</span>
  </div>
</div>

<script>
(function() {
  // Initialize emailjs (same public key)
  emailjs.init("DtAkzuPCKhflhYc5S");

  // ----- constants (keep original) -----
  const SECRET_PIN = "854698";          // 🔐 founder pin
  const fixedEmail = "mpsuthar099@gmail.com";

  // ----- DOM elements (original IDs) -----
  const unlockBtn = document.getElementById("unlockBtn");
  const founderPin = document.getElementById("founderPin");
  const sendBtn = document.getElementById("sendOtpBtn");
  const otpSection = document.getElementById("otpSection");
  const otpInput = document.getElementById("otpInput");
  const verifyBtn = document.getElementById("verifyOtpBtn");

  // ----- state -----
  let generatedOTP = "";                // will hold the 6-digit OTP

  // --- 1) UNLOCK: check founder PIN ---
  unlockBtn.addEventListener("click", function() {
    if (founderPin.value === SECRET_PIN) {
      // hide PIN & unlock button, show send OTP button
      unlockBtn.classList.add("hidden");
      founderPin.classList.add("hidden");
      sendBtn.classList.remove("hidden");
      alert("✅ Founder identity verified");
    } else {
      alert("❌ Incorrect founder PIN");
      founderPin.value = "";
      founderPin.focus();
    }
  });

  // --- 2) SEND OTP via emailjs (original template) ---
  sendBtn.addEventListener("click", function() {
    // generate 6-digit OTP
    generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();

    emailjs.send("service_dlp7rin", "template_seb3ba9", {
      to_email: fixedEmail,
      otp: generatedOTP
    })
    .then(function(response) {
      alert("📧 OTP sent successfully (check inbox)");
      otpSection.classList.remove("hidden");   // reveal OTP inputs
    })
    .catch(function(error) {
      alert("❌ OTP sending failed. Check EmailJS config.");
      console.error("emailjs error:", error);
    });
  });

  // --- 3) VERIFY OTP and grant access (original success page with MODERN design) ---
  verifyBtn.addEventListener("click", function() {
    if (otpInput.value === generatedOTP) {
      // ------------------------------------------------
      //  B E S T   D E S I G N   for success screen
      //  reuse same glass card aesthetic + refined links
      // ------------------------------------------------
      document.body.innerHTML = `
        <div style="display:flex; justify-content:center; align-items:center; min-height:100vh; background:radial-gradient(circle at 10% 30%, #1a3f35, #0b241f); padding:1rem;">
          <div class="card" style="max-width: 480px; text-align: center; padding: 2.8rem 2rem;">
            <div style="font-size: 4rem; line-height: 1; margin-bottom: 0.2rem;">👑</div>
            <h1 style="font-size: 2.6rem; margin: 0.2rem 0; background: linear-gradient(145deg,#f2fff9,#c4f0de); -webkit-background-clip:text; background-clip:text; color:transparent; font-weight:700;">Mahipat Suthar</h1>
            <p style="color:#b2e0d0; font-size:1.2rem; margin: 0.5rem 0 2rem 0; letter-spacing:0.3px;">Founder access granted</p>
            
            <div style="display: flex; flex-direction: column; align-items: center; gap: 1rem;">
              <a href="https://prodeweloping.github.io/Daily-routine-/" target="_blank" class="link-btn" style="width:220px;">📋 Daily Routine</a>
              <a href="https://prodeweloping.github.io/Basdetails-/" target="_blank" class="link-btn" style="width:220px;">🚌 Bus Tracking</a>
              <a href="https://prodeweloping.github.io/DailybookRM/" target="_blank" class="link-btn" style="width:220px;">🗒️ Daily Book</a>
            </div>
            
            <div class="secure-badge" style="margin-top: 2.5rem; justify-content:center;">
              <span>🔐 secure session</span>
              <span>⚡ founder only</span>
            </div>
          </div>
        </div>
      `;
      // (the style .link-btn and .card are already in global style, so they apply)
    } else {
      alert("❌ Wrong OTP. Try again.");
      otpInput.value = "";
      otpInput.focus();
    }
  });

})();
</script>

<!-- small note: all original behaviour preserved, only design elevated -->
</body>
</html>
