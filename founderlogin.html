<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRO founder · secure login</title>
  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 10% 30%, #1a3b32, #0b201c);
      position: relative;
      overflow: hidden;
    }

    /* animated background particles (subtle) */
    body::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: repeating-linear-gradient(45deg, 
        rgba(255,255,255,0.02) 0px, 
        rgba(255,255,255,0.02) 20px,
        rgba(0,0,0,0.02) 20px,
        rgba(0,0,0,0.02) 40px);
      animation: shift 40s linear infinite;
      pointer-events: none;
    }

    @keyframes shift {
      0% { transform: translate(-10%, -10%) rotate(0deg); }
      100% { transform: translate(10%, 10%) rotate(5deg); }
    }

    /* main glass card */
    .glass-panel {
      background: rgba(20, 40, 35, 0.75);
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border-radius: 2.5rem;
      padding: 2.8rem 2.2rem;
      width: 400px;
      max-width: 92%;
      box-shadow: 0 30px 60px -10px rgba(0, 30, 20, 0.5),
                 0 0 0 1px rgba(210, 255, 230, 0.15) inset;
      border: 1px solid rgba(120, 200, 160, 0.25);
      transition: transform 0.3s ease, box-shadow 0.4s ease;
      animation: float 6s infinite alternate ease-in-out;
      position: relative;
      z-index: 10;
    }

    .glass-panel:hover {
      box-shadow: 0 40px 70px -5px #0f2f27, 0 0 0 1px #a2f5d0 inset;
      transform: translateY(-3px);
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }

    /* header */
    .logo-area {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo-shield {
      background: linear-gradient(145deg, #1f5543, #0e3329);
      width: 70px;
      height: 70px;
      border-radius: 30% 70% 30% 70% / 40% 40% 60% 60%;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 25px -10px #0b2c22, 0 0 0 1px #56c9a0 inset;
    }

    .logo-shield span {
      font-size: 2.2rem;
      filter: drop-shadow(0 2px 5px #7fffd4);
    }

    h2 {
      color: #e5ffec;
      font-weight: 500;
      letter-spacing: 1px;
      font-size: 1.8rem;
      text-shadow: 0 2px 5px rgba(0,40,20,0.5);
      margin-bottom: 0.2rem;
    }

    .sub {
      color: #a0d8c0;
      font-size: 0.9rem;
      font-weight: 300;
      background: rgba(0,30,15,0.4);
      display: inline-block;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      backdrop-filter: blur(4px);
      border: 1px solid #3f7a64;
    }

    /* inputs / buttons */
    .input-field {
      background: rgba(15, 35, 30, 0.7);
      border: 1.5px solid #2e6b55;
      border-radius: 3rem;
      padding: 0.9rem 1.5rem;
      width: 100%;
      color: white;
      font-size: 1rem;
      outline: none;
      transition: 0.2s;
      margin: 1.2rem 0 0.8rem;
      backdrop-filter: blur(5px);
    }

    .input-field:focus {
      border-color: #7dffca;
      background: rgba(20, 50, 40, 0.8);
      box-shadow: 0 0 0 3px rgba(90, 220, 170, 0.2);
    }

    .input-field::placeholder {
      color: #99c7b2;
      font-weight: 300;
      font-size: 0.9rem;
    }

    /* button styles */
    .btn {
      background: linear-gradient(115deg, #1b674b, #279b73);
      border: none;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.9rem 1.2rem;
      border-radius: 3rem;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 8px 18px -6px #104232, 0 0 0 1px #72e0b3 inset;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin: 0.5rem 0;
      position: relative;
    }

    .btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 10px -2px #0e392e;
    }

    .btn:disabled {
      opacity: 0.6;
      filter: grayscale(40%);
      pointer-events: none;
    }

    /* spinner inside button */
    .spinner {
      display: inline-block;
      width: 1.2rem;
      height: 1.2rem;
      border: 3px solid rgba(255,255,255,0.25);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-right: 0.4rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .btn-text {
      display: inline-flex;
      align-items: center;
    }

    /* hidden utility */
    .hidden {
      display: none !important;
    }

    /* OTP section */
    #otpSection {
      margin-top: 1.2rem;
      border-top: 1px dashed #3f7a64;
      padding-top: 1.2rem;
      transition: opacity 0.3s;
    }

    .resend-link {
      background: none;
      border: none;
      color: #b1f0d2;
      text-decoration: underline dotted;
      font-size: 0.9rem;
      margin-top: 0.6rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      border-radius: 1rem;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .resend-link:hover:not(:disabled) {
      color: #ebfffb;
      background: rgba(70, 180, 140, 0.2);
      text-decoration: underline;
    }

    .resend-link:disabled {
      opacity: 0.4;
      cursor: default;
      text-decoration: none;
    }

    .tiny-spinner {
      width: 0.9rem;
      height: 0.9rem;
      border: 2px solid rgba(255,255,255,0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
    }

    /* email hint */
    .email-hint {
      color: #85b9a6;
      font-size: 0.8rem;
      margin-top: 1rem;
      border-top: 1px solid #2d5948;
      padding-top: 0.8rem;
    }

    .email-hint i {
      font-style: normal;
      background: #1e463a;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
    }
  </style>
</head>
<body>
  <div class="glass-panel" id="dynamicContainer">
    <!-- login panel (initially visible) -->
    <div id="loginPanel">
      <div class="logo-area">
        <div class="logo-shield"><span>⛊</span></div>
        <h2>PRO FOUNDER</h2>
        <div class="sub">secure OTP access</div>
      </div>

      <!-- primary button: send OTP -->
      <button class="btn" id="sendOtpBtn">
        <span class="btn-text">📨 Send OTP</span>
        <span class="spinner hidden"></span>
      </button>

      <!-- OTP section hidden until first OTP sent -->
      <div id="otpSection" class="hidden">
        <input type="text" id="otpInput" class="input-field" placeholder="6-digit OTP" inputmode="numeric" maxlength="6">
        <button class="btn" id="verifyOtpBtn">
          <span class="btn-text">🔐 Verify OTP</span>
          <span class="spinner hidden"></span>
        </button>
        <div style="text-align: center;">
          <button class="resend-link" id="resendOtpBtn">
            <span class="resend-text">↻ resend OTP</span>
            <span class="tiny-spinner hidden" id="resendSpinner"></span>
          </button>
        </div>
      </div>

      <div class="email-hint">
        <i>📧 OTP sent to founder email</i>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // Initialize EmailJS
      emailjs.init("DtAkzuPCKhflhYc5S"); // public key

      // DOM elements
      const container = document.getElementById('dynamicContainer');
      const loginPanel = document.getElementById('loginPanel');
      const sendBtn = document.getElementById('sendOtpBtn');
      const sendBtnText = sendBtn.querySelector('.btn-text');
      const sendSpinner = sendBtn.querySelector('.spinner');
      const otpSection = document.getElementById('otpSection');
      const otpInput = document.getElementById('otpInput');
      const verifyBtn = document.getElementById('verifyOtpBtn');
      const verifyBtnText = verifyBtn.querySelector('.btn-text');
      const verifySpinner = verifyBtn.querySelector('.spinner');
      const resendBtn = document.getElementById('resendOtpBtn');
      const resendText = resendBtn.querySelector('.resend-text');
      const resendSpinner = document.getElementById('resendSpinner');

      // state
      let generatedOTP = "";
      const fixedEmail = "mpsuthar099@gmail.com";

      // loading control: disable all interactive during async
      function setLoadingState(isLoading, activeButton = null) {
        sendBtn.disabled = isLoading;
        verifyBtn.disabled = isLoading;
        resendBtn.disabled = isLoading;

        if (isLoading) {
          if (activeButton === 'send') {
            sendBtnText.classList.add('hidden');
            sendSpinner.classList.remove('hidden');
          } else if (activeButton === 'verify') {
            verifyBtnText.classList.add('hidden');
            verifySpinner.classList.remove('hidden');
          } else if (activeButton === 'resend') {
            resendText.classList.add('hidden');
            resendSpinner.classList.remove('hidden');
          } else {
            // fallback
            sendBtnText.classList.add('hidden');
            verifyBtnText.classList.add('hidden');
            resendText.classList.add('hidden');
            sendSpinner.classList.remove('hidden');
            verifySpinner.classList.remove('hidden');
            resendSpinner.classList.remove('hidden');
          }
        } else {
          sendBtnText.classList.remove('hidden');
          verifyBtnText.classList.remove('hidden');
          resendText.classList.remove('hidden');
          sendSpinner.classList.add('hidden');
          verifySpinner.classList.add('hidden');
          resendSpinner.classList.add('hidden');
        }
      }

      function showMessage(msg, isError = false) {
        alert(msg);
      }

      // function to send OTP
      function requestOTP(triggerSource) {
        const otp = Math.floor(100000 + Math.random() * 900000);
        generatedOTP = otp;

        let params = {
          to_email: fixedEmail,
          otp: otp
        };

        setLoadingState(true, triggerSource);

        emailjs.send("service_dlp7rin", "template_seb3ba9", params)
          .then(function(response) {
            setLoadingState(false);
            showMessage("OTP sent to founder email ✉️");
            otpSection.classList.remove('hidden');
            otpInput.focus();
          })
          .catch(function(error) {
            setLoadingState(false);
            showMessage("Failed to send OTP. Check console.", true);
            console.error("EmailJS error:", error);
          });
      }

      // send OTP button
      sendBtn.addEventListener('click', function() {
        requestOTP('send');
      });

      // resend OTP button
      resendBtn.addEventListener('click', function() {
        if (resendBtn.disabled) return;
        requestOTP('resend');
      });

      // verify OTP button
      verifyBtn.addEventListener('click', function() {
        if (verifyBtn.disabled) return;

        const entered = otpInput.value.trim();
        if (!entered) {
          showMessage("Please enter the OTP", true);
          return;
        }

        setLoadingState(true, 'verify');

        // slight delay to show spinner
        setTimeout(() => {
          if (entered === generatedOTP.toString()) {
            // SUCCESS: transform container to white page with two links
            // Remove glass styling, set white background
            container.style.background = "white";
            container.style.backdropFilter = "none";
            container.style.border = "1px solid #e0e0e0";
            container.style.boxShadow = "0 20px 35px -8px rgba(0,40,30,0.2)";
            container.style.padding = "2rem";
            container.style.animation = "none"; // remove float

            // Inject new content
            container.innerHTML = `
              <div style="text-align: center; width: 100%;">
                <div style="margin-bottom: 2rem;">
                  <div style="background: #e8f3ef; width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem; box-shadow: 0 5px 15px #c0e0d4;">
                    <span style="font-size: 2.5rem;">👑</span>
                  </div>
                  <h1 style="color: #1f4037; font-weight: 600; font-size: 2rem;">Mahipat Suthar</h1>
                  <p style="color: #3b7b61; background: #e5faf2; display: inline-block; padding: 0.3rem 1.5rem; border-radius: 30px; font-size: 0.9rem;">founder access · secure panel</p>
                </div>

                <div style="display: flex; flex-direction: column; gap: 1rem; margin: 2.5rem 0;">
                  <!-- daily routine link -->
                  <a href="https://prodeweloping.github.io/Daily-routine-/" target="_blank" style="background: #f4fbf8; padding: 1.2rem 1.5rem; border-radius: 3rem; text-decoration: none; color: #1f4037; font-weight: 500; font-size: 1.2rem; border: 1.5px solid #b2e3d2; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: 0.15s; box-shadow: 0 4px 10px #d0ebe2;">
                    📅 my daily routine 
                    <span style="font-size: 0.9rem; color: #4f9279;">↗</span>
                  </a>
                  <!-- bus tracking link -->
                  <a href="https://prodeweloping.github.io/Basdetails-/" target="_blank" style="background: #f4fbf8; padding: 1.2rem 1.5rem; border-radius: 3rem; text-decoration: none; color: #1f4037; font-weight: 500; font-size: 1.2rem; border: 1.5px solid #b2e3d2; display: flex; align-items: center; justify-content: center; gap: 0.5rem; transition: 0.15s; box-shadow: 0 4px 10px #d0ebe2;">
                    🚌 my bus tracking
                    <span style="font-size: 0.9rem; color: #4f9279;">↗</span>
                  </a>
                </div>

                <p style="color: #6f9c8a; font-size: 0.85rem; border-top: 1px dashed #bdddd2; padding-top: 1.5rem;">
                  🔐 secure founder dashboard • you're signed in
                </p>
              </div>
            `;
          } else {
            setLoadingState(false);
            showMessage("❌ Wrong OTP, please try again", true);
            otpInput.value = '';
            otpInput.focus();
          }
        }, 600);
      });

      // Enter key in OTP field triggers verify
      otpInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          e.preventDefault();
          verifyBtn.click();
        }
      });

      // initial clean state
      otpSection.classList.add('hidden');
      setLoadingState(false);
    })();
  </script>
</body>
</html>
