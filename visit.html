<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Visitor Dashboard</title>

<style>
body{
  font-family: Arial;
  background: #0f172a;
  color: white;
  text-align: center;
  margin-top: 100px;
}

.box{
  background: #1e293b;
  padding: 40px;
  border-radius: 12px;
  display: inline-block;
  box-shadow: 0px 0px 15px rgba(0,0,0,0.4);
}

h1{
  font-size: 40px;
}

span{
  color: #22c55e;
}
</style>
</head>

<body>

<div class="box">
<h1>Total Visitors 👀</h1>
<h2><span id="visitorCount">Loading...</span></h2>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getDatabase, ref, onValue }
from "https://www.gstatic.com/firebasejs/12.11.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB2tqNIS4tLQwJHYvDk9raTYiDpTsm9U1s",
  authDomain: "website-counter-67225.firebaseapp.com",
  databaseURL: "https://website-counter-67225-default-rtdb.firebaseio.com",
  projectId: "website-counter-67225",
  storageBucket: "website-counter-67225.firebasestorage.app",
  messagingSenderId: "799275794394",
  appId: "1:799275794394:web:e470a678e15b303c7acae3"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const visitRef = ref(db, "visits");

onValue(visitRef, (snapshot) => {
  document.getElementById("visitorCount").innerText = snapshot.val();
});
</script>

</body>
</html>
