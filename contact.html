    <!-- Google Font & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { overflow-x: hidden; width: 100%; scroll-behavior: smooth; }
        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --primary: #fc8014;
            --secondary: #7209b7;
            --primary-dark: #2e4bd0;
            --secondary-light: #9d4edd;
            --gray-dark: #0b1120;
            --gray-mid: #334155;
            --gray-light: #e2e8f0;
            --glass: rgba(255,255,255,0.6);
            --shadow-sm: 0 4px 12px rgba(0,0,0,0.03), 0 2px 4px rgba(0,0,0,0.02);
            --shadow-md: 0 12px 30px -8px rgba(0,20,40,0.15);
            --shadow-lg: 0 25px 50px -12px rgba(0,0,0,0.25);
            --radius-md: 20px;
            --radius-lg: 32px;
            --transition: all 0.3s ease;
            --transition-bounce: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        body { font-family: "Inter", system-ui, sans-serif; background-color: var(--bg); color: var(--gray-dark); overflow-x: hidden; width: 100%; }
        img { max-width: 100%; height: auto; display: block; }
        .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; width: 100%; }
        section { padding: 80px 0; }
        
        h2 { font-size: clamp(1.8rem, 4vw, 2.8rem); text-align: center; margin-bottom: 3rem; position: relative; font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; }
        h2::after { content: ''; display: block; width: 80px; height: 5px; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 4px; margin: 1rem auto 0; }
        h3 { font-weight: 700; line-height: 1.2; letter-spacing: -0.02em; }
        p { color: var(--gray-mid); margin-bottom: 1.2rem; line-height: 1.5; }
        
        /* Contact Section - identical to index.html */
        .contact-container { display: grid; grid-template-columns: 1fr 1.5fr; gap: 50px; background: white; border-radius: 60px; padding: 50px; box-shadow: var(--shadow-lg); }
        .contact-info { display: flex; flex-direction: column; gap: 30px; }
        .contact-item { display: flex; align-items: center; gap: 20px; background: #f8fafc; padding: 20px; border-radius: 40px; transition: var(--transition); }
        .contact-item:hover { background: linear-gradient(105deg, #fc8014, #7209b7); transform: translateX(10px); }
        .contact-item:hover .contact-icon { background: white; color: var(--primary); }
        .contact-item:hover h3, .contact-item:hover p { color: white; }
        .contact-icon { width: 60px; height: 60px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; transition: var(--transition); }
        .contact-form { background: #f1f5f9; border-radius: 48px; padding: 40px; }
        .form-group { margin-bottom: 22px; }
        label { font-weight: 600; color: var(--gray-dark); margin-bottom: 8px; display: block; }
        .form-control, .service-select, .sub-category-select, .sub-service-select { width: 100%; padding: 16px 20px; border: 1px solid #d1d9e6; border-radius: 40px; font-size: 1rem; background: white; transition: 0.2s; }
        .form-control:focus, .service-select:focus, .sub-category-select:focus, .sub-service-select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(252,128,20,0.15); outline: none; }
        textarea.form-control { min-height: 140px; border-radius: 28px; resize: vertical; }
        .sub-category-group, .sub-service-group { margin-top: 15px; display: none; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 36px;
            background: var(--primary); color: white; font-weight: 600; border: none; border-radius: 60px;
            cursor: pointer; text-decoration: none; transition: var(--transition-bounce);
            box-shadow: 0 8px 18px -6px rgba(252,128,20,0.3); white-space: nowrap;
            width: 100%;
        }
        .btn-accent { background: linear-gradient(105deg, #fc8014, #7209b7); }
        .btn-accent:hover { background: linear-gradient(105deg, #2e4bd0, #9d4edd); transform: translateY(-3px); }
        .btn.loading { pointer-events: none; opacity: 0.85; }
        .btn .spinner { display: none; width: 20px; height: 20px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; margin-right: 8px; }
        .btn.loading .btn-text { display: none; }
        .btn.loading .spinner { display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Blob decorations */
        .blob { position: fixed; width: 600px; height: 600px; background: radial-gradient(circle at 30% 50%, rgba(252,128,20,0.06), transparent 70%); border-radius: 50%; z-index: -2; pointer-events: none; }
        .blob-1 { top: -200px; left: -200px; }
        .blob-2 { bottom: -200px; right: -200px; background: radial-gradient(circle at 70% 30%, rgba(114,9,183,0.06), transparent 70%); }

        /* ===== HEADER / NAVIGATION EXACT SAME AS INDEX ===== */
        header { position: fixed; width: 100%; top: 20px; z-index: 1000; padding: 0 20px; }
        nav { max-width: 1280px; margin: 0 auto; background: var(--glass); backdrop-filter: blur(16px) saturate(180%); border-radius: 100px; padding: 10px 28px; box-shadow: var(--shadow-sm), 0 0 0 1px rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: space-between; }
        .logo { font-size: 1.9rem; font-weight: 800; text-decoration: none; letter-spacing: -0.5px; color: var(--gray-dark); }
        .logo span { color: var(--primary); }
        
        .mobile-menu-btn { 
            display: block; 
            background: rgba(255,255,255,0.9); 
            border: none; 
            font-size: 1.8rem; 
            color: #fc8014; 
            cursor: pointer; 
            width: 48px; 
            height: 48px; 
            border-radius: 60px; 
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }
        .mobile-menu-btn:hover { background: linear-gradient(105deg, #fc8014, #7209b7); color: white; transform: scale(1.02); }
        
        .side-menu {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100vh;
            background: rgba(11, 17, 32, 0.96);
            backdrop-filter: blur(20px);
            z-index: 2000;
            transition: left 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            box-shadow: 8px 0 30px rgba(0,0,0,0.3);
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            gap: 36px;
            border-radius: 0 32px 32px 0;
        }
        .side-menu.active { left: 0; }
        .side-menu-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(255,255,255,0.2); padding-bottom: 20px; }
        .side-menu-logo { font-size: 1.8rem; font-weight: 800; color: white; text-decoration: none; }
        .side-menu-logo span { color: var(--primary); }
        .close-menu { background: rgba(255,255,255,0.15); border: none; color: white; font-size: 1.5rem; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; transition: 0.2s; }
        .close-menu:hover { background: var(--primary); transform: rotate(90deg); }
        .side-nav-links { list-style: none; display: flex; flex-direction: column; gap: 28px; margin-top: 20px; }
        .side-nav-links li a { color: #f1f5f9; text-decoration: none; font-size: 1.5rem; font-weight: 600; display: flex; align-items: center; gap: 16px; padding: 10px 0; transition: 0.25s; }
        .side-nav-links li a i { width: 32px; font-size: 1.4rem; color: var(--primary); }
        .side-nav-links li a:hover { color: var(--primary); transform: translateX(8px); }
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(3px); z-index: 1999; opacity: 0; visibility: hidden; transition: 0.3s; }
        .menu-overlay.active { opacity: 1; visibility: visible; }
        
        /* ===== SIMPLE FOOTER - CHANGED ONLY ===== */
        footer { background: #0b1120; color: #e2e8f0; padding: 48px 0 32px; margin-top: 40px; border-radius: 48px 48px 0 0; }
        .footer-simple { text-align: center; }
        .footer-logo-simple { font-size: 2rem; font-weight: 800; color: white; text-decoration: none; letter-spacing: -0.02em; }
        .footer-logo-simple span { color: var(--primary); }
        .footer-copyright { margin-top: 28px; font-size: 0.9rem; color: #9aa9bb; border-top: 1px solid #1e293b; padding-top: 24px; display: inline-block; width: 100%; }
        
        .floating-action-btn { position: fixed; right: 25px; bottom: 25px; width: 58px; height: 58px; border-radius: 50%; background: #25D366; color: white; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); cursor: pointer; z-index: 999; transition: 0.3s ease; text-decoration: none; }
        .floating-action-btn:hover { transform: translateY(-6px); background: #128C7E; }
        
        /* Responsive (same breakpoints as index) */
        @media (max-width: 1024px) {
            .container { padding: 0 20px; }
            section { padding: 70px 0; }
            .contact-container { padding: 40px; gap: 40px; }
        }
        @media (max-width: 768px) {
            .container { padding: 0 18px; }
            section { padding: 60px 0; }
            .contact-container { grid-template-columns: 1fr; padding: 30px; gap: 30px; border-radius: 48px; }
            footer { border-radius: 40px 40px 0 0; }
        }
        @media (max-width: 480px) {
            .container { padding: 0 16px; }
            section { padding: 50px 0; }
            .contact-container { padding: 20px; border-radius: 32px; gap: 20px; }
            .contact-item { padding: 16px; gap: 12px; flex-wrap: wrap; justify-content: flex-start; text-align: left; }
            .contact-icon { width: 50px; height: 50px; font-size: 1.3rem; }
            .contact-form { padding: 24px; border-radius: 32px; }
            .form-control, .service-select { padding: 14px 16px; }
            .btn { width: 100%; justify-content: center; padding: 12px 20px; white-space: normal; }
            .floating-action-btn { width: 48px; height: 48px; font-size: 24px; right: 16px; bottom: 16px; }
            nav { padding: 8px 18px; }
            .logo { font-size: 1.5rem; }
            .mobile-menu-btn { width: 44px; height: 44px; font-size: 1.5rem; }
            h2::after { width: 70px; }
            .footer-logo-simple { font-size: 1.5rem; }
        }
        @media (max-width: 360px) {
            .container { padding: 0 12px; }
            .contact-container { padding: 16px; }
            .contact-item h3 { font-size: 1rem; }
            .contact-item p { font-size: 0.85rem; }
            .contact-form { padding: 18px; }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- HEADER - EXACT SAME AS INDEX -->
    <header>
        <nav>
            <a href="index.html" class="logo">Pro <span>Developing</span></a>
            <button class="mobile-menu-btn" id="menuToggleBtn" aria-label="menu"><i class="fas fa-bars"></i></button>

    <!-- SIDE MENU - IDENTICAL -->
    <div class="side-menu" id="sideMenu">

            <li><a href="#services"><i class="fas fa-cogs"></i> Services</a></li>
            <li><a href="#about"><i class="fas fa-info-circle"></i> About</a></li>

    <!-- ONLY CONTACT SECTION (IDENTICAL CONTENT FROM INDEX) -->
    <section id="contact" style="padding-top: 140px;">
        <div class="container">
            <h2>Get in Touch</h2>
            <div class="contact-container">
                <div class="contact-info">
                    <div class="contact-item">
                        <div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div>
                        <div><h3>Location</h3><p>Vav-Tharad District, Gujarat</p></div>
                    </div>
                    <div class="contact-item">
                        <div class="contact-icon"><i class="fas fa-phone"></i></div>
                        <div><h3>Call us</h3><p>+91 63569 52788</p></div>
                    </div>
                    <div class="contact-item">
                        <div class="contact-icon"><i class="fas fa-envelope"></i></div>
                        <div><h3>Email</h3><p>prodeveloping97@gmail.com</p></div>

                <div class="contact-form">
                    <h3>Send message</h3>
                    <form id="contactForm">
                        <div class="form-group"><label>Full name</label><input type="text" name="name" id="name" class="form-control" placeholder="Enter your full name" required></div>
                        <div class="form-group"><label>Email</label><input type="email" name="email" id="email" class="form-control" placeholder="Enter your email address" required></div>
                        <div class="form-group"><label>Mobile</label><input type="tel" name="phone" id="phone" class="form-control" placeholder="Enter your mobile number" required></div>
                        <div class="form-group"><label>Service needed</label>
                            <select id="service" name="service" class="service-select" required>
                                <option value="" disabled selected>Select service</option>
                                <option value="Test">Test</option>
                                <option value="New user">New user</option>
                                <option value="Old user">Old user</option>
                                <option value="Premium Web work">Premium Web work</option>
                                <option value="Custom tools work">Custom tools work</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="form-group sub-category-group" id="subCategoryGroup">
                            <label for="subCategory">Website type</label>
                            <select id="subCategory" class="sub-category-select">
                                <option value="" disabled selected>-- choose Static or Dynamic --</option>
                                <option value="Static">Static</option>
                                <option value="Dynamic">Dynamic</option>
                            </select>
                        </div>
                        <div class="form-group sub-service-group" id="subServiceGroup">
                            <label for="subService">Select specific service <span id="subServiceLabel"></span></label>
                            <select id="subService" class="sub-service-select">
                                <option value="" disabled selected>-- choose one --</option>

                        <div class="form-group"><label>Message</label><textarea id="message" name="message" class="form-control" placeholder="Tell us about your project ..." required></textarea></div>
                        <input type="hidden" id="combinedService" name="combinedService">
                        <button type="submit" class="btn btn-accent" id="contactSubmitBtn"><span class="btn-text">Send message</span><span class="spinner"></span></button>
                    </form>
                </div>

        </div>
    </section>

    <!-- SIMPLE FOOTER - CHANGED ONLY -->
    <footer>
        <div class="container">
            <div class="footer-simple">
                <a href="index.html" class="footer-logo-simple">Pro <span>Developing</span></a>
                <div class="footer-copyright">© 2026 ProDeveloping</div>
            </div>
        </div>
    </footer>

    <!-- FLOATING ACTION BUTTON (WHATSAPP / SCROLL TOP) SAME BEHAVIOR -->
    <a href="https://wa.me/916356952788" target="_blank" id="floatingActionBtn" class="floating-action-btn"><i id="floatingIcon" class="fab fa-whatsapp"></i></a>

    <!-- EMAILJS LIBRARY -->
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script>
        (function(){ emailjs.init("O6JKIbUeu1dewfkTH"); })();

        // ========== SIDE MENU LOGIC (EXACT AS INDEX) ==========
        const menuToggle = document.getElementById('menuToggleBtn');
        const sideMenu = document.getElementById('sideMenu');
        const overlay = document.getElementById('menuOverlay');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        
        function openMenu() { sideMenu.classList.add('active'); overlay.classList.add('active'); document.body.style.overflow = 'hidden'; }
        function closeMenu() { sideMenu.classList.remove('active'); overlay.classList.remove('active'); document.body.style.overflow = ''; }
        
        if(menuToggle) menuToggle.addEventListener('click', openMenu);
        if(closeMenuBtn) closeMenuBtn.addEventListener('click', closeMenu);
        if(overlay) overlay.addEventListener('click', closeMenu);
        
        // Close side menu on link click - allow navigation
        document.querySelectorAll('.side-nav-links a').forEach(link => {
            link.addEventListener('click', (e) => {
                closeMenu();
            });
        });
        
        // ========== DYNAMIC FORM LOGIC (SAME AS INDEX) ==========
        const mainService = document.getElementById('service');
        const subCategoryGroup = document.getElementById('subCategoryGroup');
        const subCategory = document.getElementById('subCategory');
        const subServiceGroup = document.getElementById('subServiceGroup');
        const subService = document.getElementById('subService');
        const subServiceLabel = document.getElementById('subServiceLabel');
        const staticOptions = ['Portfolio Website','Business Website','Landing Page Design',' Education Information Website'];
        const dynamicOptions = ['eCommerce Website','Admin Panel Development','Booking System Website','Hospital Management website'];
        
        function resetSubServices() {
            if(subCategory) subCategory.value = '';
            subService.innerHTML = '<option value="" disabled selected>-- choose one --</option>';
            subServiceGroup.style.display = 'none';
            subCategoryGroup.style.display = 'none';
        }
        
        function updateSubCategory() {
            resetSubServices();
            const selectedMain = mainService.value;
            if(selectedMain === 'Premium Web work') {
                subCategoryGroup.style.display = 'block';
                subCategory.required = true;
            } else if(selectedMain === 'Custom tools work') {
                subServiceGroup.style.display = 'block';
                subServiceLabel.textContent = '(Custom tools work)';
                subService.required = true;
                subService.innerHTML = '<option value="" disabled selected>-- choose one --</option>';
                ['Admin panel tools', 'Custom dashboard tool', 'Automation script', 'API integration'].forEach(opt => {
                    let op = document.createElement('option');
                    op.value = opt;
                    op.textContent = opt;
                    subService.appendChild(op);
                });
            } else {
                subCategoryGroup.style.display = 'none';
                subServiceGroup.style.display = 'none';
                subCategory.required = false;
                subService.required = false;
            }
        }
        
        function updateSubServiceByCategory() {
            const category = subCategory.value;
            if(!category) {
                subServiceGroup.style.display = 'none';
                subService.required = false;
                return;
            }
            subServiceGroup.style.display = 'block';
            subService.required = true;
            subServiceLabel.textContent = `(${category})`;
            let options = category === 'Static' ? staticOptions : dynamicOptions;
            subService.innerHTML = '<option value="" disabled selected>-- choose one --</option>';
            options.forEach(opt => {
                let op = document.createElement('option');
                op.value = opt;
                op.textContent = opt;
                subService.appendChild(op);
            });
        }
        
        if(mainService) {
            mainService.addEventListener('change', updateSubCategory);
            if(subCategory) subCategory.addEventListener('change', updateSubServiceByCategory);
            updateSubCategory();
        }
        
        // ========== CONTACT FORM SUBMISSION (GOOGLE SHEETS) ==========
        const contactForm = document.getElementById('contactForm');
        const contactBtn = document.getElementById('contactSubmitBtn');
        const combinedHidden = document.getElementById('combinedService');
        const GS_URL = "https://script.google.com/macros/s/AKfycbzsFq6zTL8skxfR9SfYj5nQVYWzlG6Mifsm8VticiZi9Hk9AGrrqMM_zkNQNevrRnvL/exec";
        
        contactForm.addEventListener('submit', function(e) {
            e.preventDefault();
            if(contactBtn.classList.contains('loading')) return;
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const mainVal = mainService.value;
            const msg = document.getElementById("message").value.trim();
            if(!name || !email || !phone || !mainVal || !msg) { alert("Please fill all required fields"); return; }
            if(mainVal === 'Premium Web work') { if(!subCategory.value || !subService.value) { alert("Please select website type and specific service"); return; } }
            else if(mainVal === 'Custom tools work') { if(!subService.value) { alert("Please select a custom tool option"); return; } }
            let combined = mainVal;
            if(mainVal === 'Premium Web work' && subCategory.value && subService.value) combined += ' - ' + subCategory.value + ' - ' + subService.value;
            else if(mainVal === 'Custom tools work' && subService.value) combined += ' - ' + subService.value;
            combinedHidden.value = combined;
            const formData = { name, email, phone, service: combined, message: msg };
            contactBtn.classList.add('loading');
            fetch(GS_URL, { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: new URLSearchParams(formData) })
            .then(res => res.json()).then(data => { if(data.status === "success") { alert("✅ Message sent!"); contactForm.reset(); updateSubCategory(); } else { alert("❌ Error: " + data.message); } })
            .catch(() => alert("❌ Network error")).finally(() => contactBtn.classList.remove('loading'));
        });
        
        // ========== FLOATING BUTTON: SCROLL TO TOP WHEN SCROLLED >400px, ELSE WHATSAPP ==========
        const floatingBtn = document.getElementById("floatingActionBtn");
        const floatingIcon = document.getElementById("floatingIcon");
        
        window.addEventListener("scroll", () => { 
            if (window.scrollY > 400) { 
                floatingBtn.href = "#"; 
                floatingBtn.style.background = "#2e4bd0"; 
                floatingIcon.className = "fas fa-arrow-up"; 
            } else { 
                floatingBtn.href = "https://wa.me/916356952788"; 
                floatingBtn.style.background = "#25D366"; 
                floatingIcon.className = "fab fa-whatsapp"; 
            } 
        });
        
        floatingBtn.addEventListener("click", function(e){ 
            if(window.scrollY > 400){ 
                e.preventDefault(); 
                window.scrollTo({ top: 0, behavior: "smooth" }); 
            } 
        });
        
        // Smooth scroll for any anchor links
        document.querySelectorAll('a[href^="#"]:not(#floatingActionBtn)').forEach(a => a.addEventListener('click', function(e) {
            if(this.getAttribute('href') === '#') return;
            const target = document.querySelector(this.hash);
            if(target) { e.preventDefault(); window.scrollTo({ top: target.offsetTop - 80, behavior: 'smooth' }); }
        }));
    </script>
</body>
</html>
