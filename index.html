<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Site Under Construction | Pro Developing</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#0f172a,#1e293b,#334155);
      overflow:hidden;
      color:#fff;
      position:relative;
    }

    .bg-circle{
      position:absolute;
      border-radius:50%;
      filter:blur(80px);
      opacity:0.4;
      animation:float 8s infinite ease-in-out;
    }

    .circle1{
      width:300px;
      height:300px;
      background:#00d4ff;
      top:-100px;
      left:-100px;
    }

    .circle2{
      width:250px;
      height:250px;
      background:#7c3aed;
      bottom:-80px;
      right:-80px;
    }

    @keyframes float{
      0%,100%{
        transform:translateY(0px);
      }
      50%{
        transform:translateY(20px);
      }
    }

    .container{
      position:relative;
      z-index:2;
      width:90%;
      max-width:700px;
      padding:50px;
      border-radius:25px;
      background:rgba(255,255,255,0.08);
      backdrop-filter:blur(15px);
      border:1px solid rgba(255,255,255,0.15);
      text-align:center;
      box-shadow:0 10px 40px rgba(0,0,0,0.4);
    }

    .logo{
      font-size:55px;
      margin-bottom:15px;
    }

    h1{
      font-size:42px;
      margin-bottom:15px;
      font-weight:700;
      background:linear-gradient(to right,#00d4ff,#ffffff);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    p{
      font-size:17px;
      color:#d1d5db;
      margin-bottom:35px;
      line-height:1.7;
    }

    .status{
      display:inline-block;
      padding:12px 28px;
      background:#00d4ff;
      color:#000;
      font-weight:600;
      border-radius:50px;
      margin-bottom:30px;
      animation:pulse 2s infinite;
    }

    @keyframes pulse{
      0%{
        transform:scale(1);
      }
      50%{
        transform:scale(1.05);
      }
      100%{
        transform:scale(1);
      }
    }

    .buttons{
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
    }

    .btn{
      text-decoration:none;
      padding:14px 28px;
      border-radius:50px;
      font-weight:600;
      transition:0.3s ease;
      border:2px solid transparent;
    }

    .whatsapp{
      background:#25D366;
      color:#fff;
    }

    .email{
      background:transparent;
      border:2px solid #fff;
      color:#fff;
    }

    .btn:hover{
      transform:translateY(-4px);
      box-shadow:0 10px 20px rgba(0,0,0,0.3);
    }

    footer{
      margin-top:35px;
      color:#94a3b8;
      font-size:14px;
    }

    @media(max-width:600px){
      h1{
        font-size:30px;
      }

      .container{
        padding:35px 25px;
      }

      p{
        font-size:15px;
      }
    }
  </style>
</head>

<body>

  <div class="bg-circle circle1"></div>
  <div class="bg-circle circle2"></div>

  <div class="container">

    <div class="logo">🚧</div>

    <div class="status">SITE UNDER CONSTRUCTION</div>

    <h1>We're Building Something Awesome</h1>

    <p>
      Our website is currently under construction.<br>
      We’re working hard to give you the best experience.<br>
      Please contact us directly for any inquiries.
    </p>

    <div class="buttons">
      <a class="btn whatsapp" 
         href="https://wa.me/916356952788" 
         target="_blank">
         WhatsApp Us
      </a>

      <a class="btn email" 
         href="mailto:prodeveloping97@gmail.com">
         Send Email
      </a>
    </div>

    <footer>
      © 2026 Pro Developing | All Rights Reserved
    </footer>

  </div>

</body>
</html>
