<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Premium Web Work | Static & Dynamic</title>
  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <!-- Google Fonts + Font Awesome 6 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #4361ee;
      --purple: #7209b7;
      --accent: #06d6a0;
      --dark: #0b132b;
      --gray-dark: #4a4e69;
      --light: #f8f9fa;
      --white: #ffffff;
      --gradient: linear-gradient(135deg, #4361ee, #7209b7);
      --gradient-accent: linear-gradient(135deg, #06d6a0, #4361ee);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
      --shadow-lg: 0 20px 35px -12px rgba(67, 97, 238, 0.2);
      --radius: 20px;
      --radius-md: 20px;
      --transition: 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4fa;
      color: var(--dark);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* loading overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s, visibility 0.4s;
    }
    .loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .loader {
      width: 60px;
      height: 60px;
      border: 5px solid #e9ecef;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* navbar with scroll effect */
    .navbar {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(16px);
      padding: 4px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 1000;
      transition: all 0.3s ease;
      border-bottom: 1px solid rgba(0, 0, 0, 0.03);
      box-shadow: none;
    }
    .navbar.scrolled {
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      padding: 10px 32px;
    }
    .logo {
      font-size: 1.7rem;
      font-weight: 800;
      font-family: 'Poppins', sans-serif;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.3px;
    }
    .order-nav-btn {
      background: var(--gradient);
      color: white;
      border: none;
      padding: 10px 26px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(67, 97, 238, 0.25);
    }
    .order-nav-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 22px rgba(67, 97, 238, 0.35);
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 100px 30px 50px;
    }

    /* hero */
    .hero-header {
      background: var(--white);
      border-radius: var(--radius);
      padding: 50px 30px;
      text-align: center;
      margin-bottom: 50px;
      box-shadow: var(--shadow-md);
      transition: all 0.7s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      opacity: 0;
      transform: translateY(30px);
      animation: fadeSlideUp 0.8s forwards;
    }
    @keyframes fadeSlideUp {
      to { opacity: 1; transform: translateY(0); }
    }
    .hero-badge {
      background: rgba(67, 97, 238, 0.1);
      color: var(--primary);
      font-weight: 600;
      font-size: 0.8rem;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      display: inline-block;
      margin-bottom: 1rem;
    }
    .hero-subtitle {
      color: var(--gray-dark);
      font-size: 1.1rem;
      max-width: 650px;
      margin: 1rem auto 1rem;
    }
    /* text slider */
    .text-slider {
      font-size: 1.8rem;
      font-weight: 700;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      min-height: 70px;
      margin-top: 10px;
    }
    .slider-word {
      display: inline-block;
      animation: fadeWord 0.5s ease;
    }
    @keyframes fadeWord {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* toggle buttons */
    .toggle-buttons {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 25px;
    }
    .toggle-btn {
      background: white;
      border: 1px solid #e2e8f0;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.7rem 1.8rem;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #1e293b;
    }
    .toggle-btn.active {
      background: var(--gradient);
      border-color: transparent;
      color: white;
      box-shadow: 0 8px 18px rgba(67, 97, 238, 0.3);
    }

    .category-title {
      text-align: center;
      margin: 0.5rem 0 2rem;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s ease;
    }
    .category-title.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .category-title h3 {
      font-size: 1.8rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.7);
      display: inline-block;
      padding: 0.3rem 1.8rem;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border-left: 3px solid var(--primary);
      border-right: 3px solid var(--primary);
    }

    /* services grid */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px;
      margin-top: 20px;
    }
    @media (max-width: 1100px) {
      .services-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .services-grid { grid-template-columns: 1fr; }
    }
    .service-card {
      background: var(--white);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      transition: all 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      display: flex;
      flex-direction: column;
      text-align: center;
      opacity: 0;
      transform: translateY(30px);
    }
    .service-card.animate-card {
      opacity: 1;
      transform: translateY(0);
    }
    .service-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
    }
    /* icon container */
    .card-icon-wrapper {
      background: linear-gradient(145deg, #f8faff, #ffffff);
      padding: 30px 0 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .icon-circle {
      background: var(--gradient);
      width: 100px;
      height: 100px;
      border-radius: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 25px rgba(67, 97, 238, 0.25);
      transition: transform 0.3s;
    }
    .service-card:hover .icon-circle {
      transform: scale(1.05);
    }
    .icon-circle i {
      font-size: 52px;
      color: white;
    }
    .card-content {
      padding: 20px 22px 28px;
      flex: 1;
    }
    .service-card h4 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .service-description {
      color: var(--gray-dark);
      font-size: 0.88rem;
      line-height: 1.5;
      margin-bottom: 25px;
      padding: 0 5px;
      min-height: 65px;
    }
    .btn-preview {
      background: var(--gradient);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 40px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      margin-top: auto;
      transition: all 0.2s;
    }
    .btn-preview:hover {
      filter: brightness(1.05);
      transform: translateY(-2px);
    }
    .footer {
      background: var(--white);
      border-radius: var(--radius);
      padding: 40px 30px;
      text-align: center;
      margin-top: 60px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s ease;
    }
    .footer.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* MODAL STYLES */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--white);
      border-radius: 30px;
      width: 100%;
      max-width: 750px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 30px 60px rgba(0,0,0,0.3);
      transform: scale(0.95);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-overlay.active .modal { transform: scale(1); }
    .modal-header {
      padding: 26px;
      background: var(--gradient);
      color: white;
      position: relative;
      border-radius: 30px 30px 0 0;
      text-align: center;
    }
    .modal-title {
      font-size: 2rem;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
    }
    .close-modal {
      position: absolute;
      top: 18px;
      right: 20px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      font-size: 2rem;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
    }
    .modal-body { padding: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      color: var(--dark);
    }
    .form-control, .form-select, .package-select {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e9ecef;
      border-radius: 18px;
      font-size: 1rem;
      background: #f8fafc;
      transition: 0.2s;
    }
    .form-control:focus, .form-select:focus {
      border-color: var(--primary);
      outline: none;
    }
    .budget-options {
      background: #f9fbfe;
      border-radius: 24px;
      padding: 0.8rem 1rem;
      border: 1px solid #e9edf2;
    }
    .preset-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .preset-btn {
      background: white;
      border: 1.5px solid #dce5ec;
      border-radius: 40px;
      padding: 8px 18px;
      font-weight: 600;
      cursor: pointer;
    }
    .preset-btn.active {
      background: #1c3e55;
      border-color: #1c3e55;
      color: white;
    }
    .manual-budget {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .budget-display {
      background: #eef3fc;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.85rem;
      margin-top: 12px;
    }
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 8px;
    }
    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }
    .btn-submit {
      width: 100%;
      padding: 18px;
      background: var(--gradient);
      border: none;
      border-radius: 40px;
      color: white;
      font-weight: 700;
      font-size: 1.2rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }
    .error-message, .success-message { display: none; padding: 12px; border-radius: 16px; margin-bottom: 20px; }
    .error-message.show, .success-message.show { display: block; }
    .error-message { background: #ffe9e9; color: #b00020; }
    .success-message { background: #e3f9ed; color: #0b5e42; }
  </style>
</head>
<body>

<nav class="navbar" id="navbar">
  <div class="logo">✦ Premium Work</div>
  <button id="orderNavBtn" class="order-nav-btn"><i class="fas fa-pen"></i> Order now</button>
</nav>

<main class="container">
  <div class="hero-header">
    <div class="hero-badge"><i class="fas fa-crown"></i> Premium web work</div>
    <p class="hero-subtitle">Static Foundations. Dynamic Engines. Tailor-Made Digital Solutions with Live Preview 🚀</p>
    <div class="toggle-buttons">
      <button id="staticToggleBtn" class="toggle-btn active"><i class="fas fa-layer-group"></i> Statics</button>
      <button id="dynamicToggleBtn" class="toggle-btn"><i class="fas fa-bolt"></i> Dynamic</button>
    </div>
  </div>

  <div class="category-title" id="categoryTitleWrapper"><h3 id="categoryDynamicTitle">📁 Static Solutions</h3></div>
  <div id="servicesGridContainer" class="services-grid"></div>
</main>

<footer class="footer" id="footerSection">
  <p><i class="fas fa-code"></i> © 2026 ProDeveloping – Premium Web Work</p>
</footer>

<!-- MODAL with placeholders restored -->
<div class="modal-overlay" id="orderModal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title">Custom Website Order</h2>
      <button class="close-modal" id="closeModalBtn">&times;</button>
    </div>
    <div class="modal-body">
      <div id="errorMsg" class="error-message"><i class="fas fa-exclamation-circle"></i> <span id="errorText"></span></div>
      <div id="successMsg" class="success-message"><i class="fas fa-check-circle"></i> ✅ request sent! we'll contact you soon.</div>
      <form id="orderForm">
        <div class="form-group"><label class="form-label">Your Name *</label><input type="text" id="name" class="form-control" placeholder="Full name" required></div>
        <div class="form-group"><label class="form-label">Mobile Number *</label><input type="tel" id="mobile" class="form-control" placeholder="+91 6356952788" required></div>
        <div class="form-group"><label class="form-label">Email Address *</label><input type="email" id="email" class="form-control" placeholder="you@example.com" required></div>
        <div class="form-group"><label class="form-label">Website Name *</label><input type="text" id="websiteName" class="form-control" placeholder="e.g., MyBusinessHub" required></div>
        <div class="form-group"><div class="radio-group" id="typeRadioGroup"><label><input type="radio" name="websiteType" value="Statics" checked> Statics</label><label><input type="radio" name="websiteType" value="Dynamic"> Dynamic</label></div></div>
        <div class="form-group"><label class="form-label">Select Website Package *</label><select id="packageSelect" class="package-select" required><option value="">-- Select a package --</option></select></div>
        <div class="form-group"><label class="form-label"><i class="fas fa-coins"></i> Budget range (INR) *</label><div class="budget-options"><div class="preset-buttons"><button type="button" class="preset-btn" data-value="2000">₹ 2,000</button><button type="button" class="preset-btn" data-value="5000">₹ 5,000</button><button type="button" class="preset-btn" data-value="10000">₹ 10,000</button></div><div class="manual-budget"><label>Custom amount:</label><input type="number" id="customBudget" placeholder="Enter any amount (₹)" step="1000"></div><div class="budget-display"><i class="fas fa-chart-line"></i> Selected budget: <span id="selectedBudgetSpan">—</span></div></div></div>
        <div class="form-group"><label class="form-label">Pages Needed * (select at least one)</label><div class="checkbox-group" id="pageNeedsGroup"><label><input type="checkbox" value="Home"> Home</label><label><input type="checkbox" value="About"> About</label><label><input type="checkbox" value="Services"> Services</label><label><input type="checkbox" value="Products"> Products</label><label><input type="checkbox" value="Contact"> Contact</label><label><input type="checkbox" value="Gallery"> Gallery</label><label><input type="checkbox" value="Blog"> Blog</label><label><input type="checkbox" value="Other"> Other</label></div><input type="text" id="otherPages" class="form-control" style="margin-top:10px;" placeholder="If 'Other', specify pages"></div>
        <div class="form-group"><label class="form-label">Features Required (select all that apply)</label><div class="checkbox-group" id="featuresGroup"><label><input type="checkbox" value="Contact form"> Contact form</label><label><input type="checkbox" value="WhatsApp button"> WhatsApp button</label><label><input type="checkbox" value="Payment gateway"> Payment gateway</label><label><input type="checkbox" value="Admin panel"> Admin panel</label><label><input type="checkbox" value="Notification system"> Notification system</label><label><input type="checkbox" value="Login system"> Login system</label><label><input type="checkbox" value="Order system"> Order system</label></div></div>
        <div class="form-group"><label class="form-label">Additional Description / Requirements</label><textarea id="description" class="form-control" rows="4" placeholder="Any specific design, colors, functionality..."></textarea></div>
        <button type="submit" class="btn-submit" id="submitBtn"><i class="fas fa-paper-plane"></i> <span>send request</span></button>
      </form>
    </div>
  </div>
</div>

<script>
  (function() { emailjs.init("FfnVW2oPii98q0uHl"); })();

  // Static services with enhanced descriptions
  const staticServices = [
    { title: "Portfolio Website", desc: "Showcase personal skills, projects, and achievements for freelancers, students, and professionals.", icon: "fa-user", url: "https://prodeveloping.github.io/Demo1/" },
    { title: "Business Website", desc: "Create strong online presence for companies with services, contact details, and brand information.", icon: "fa-briefcase", url: "https://prodeveloping.github.io/Demo2/" },
    { title: "Landing Page Design", desc: "High-conversion single-page website for marketing campaigns and product promotions.", icon: "fa-window-maximize", url: "https://prodeveloping.github.io/Demo3/" },
    { title: "Education information Website", desc: "Perfect for schools, coaching classes, and institutes to display courses and updates.", icon: "fa-graduation-cap", url: "https://prodeveloping.github.io/Demo4/" }
  ];
  
  // Dynamic services with enhanced descriptions
  const dynamicServices = [
    { title: "Ecommerce Website", desc: "Sell products online with cart system, payment gateway, and order management.", icon: "fa-cart-shopping", url: "https://prodeveloping.github.io/Demo1/" },
    { title: "Booking System", desc: "Allow customers to book appointments, rooms, or services online easily.", icon: "fa-calendar-check", url: "https://prodeveloping.github.io/Demo2/" },
    { title: "Admin Panel", desc: "Manage website data, users, products, and content from dashboard.", icon: "fa-gauge-high", url: "https://prodeveloping.github.io/Demo3/" },
    { title: "Hospital Management", desc: "Manage patients, doctors, appointments, and reports digitally.", icon: "fa-hospital", url: "https://prodeveloping.github.io/Demo4/" }
  ];

  let currentCategory = 'static';
  const staticBtn = document.getElementById('staticToggleBtn');
  const dynamicBtn = document.getElementById('dynamicToggleBtn');
  const categoryTitleElem = document.getElementById('categoryDynamicTitle');
  const gridContainer = document.getElementById('servicesGridContainer');
  const categoryWrapper = document.getElementById('categoryTitleWrapper');

  function renderServices() {
   const services = currentCategory === 'static' ? staticServices : dynamicServices;
    categoryTitleElem.textContent = currentCategory === 'static' ? '📁 Static Solutions' : '⚡ Dynamic Solutions';
    let html = '';
    services.forEach((s, idx) => {
      html += `
        <div class="service-card" data-index="${idx}">
          <div class="card-icon-wrapper">
            <div class="icon-circle"><i class="fas ${s.icon}"></i></div>
          </div>
          <div class="card-content">
            <h4>${s.title}</h4>
            <div class="service-description">${s.desc}</div>
            ${ idx === 0 ? `<a class="btn-preview" href="${s.url}" target="_blank"><i class="fas fa-eye"></i> Live Preview</a>` : '' }
          </div>
        </div>
      `;
    });
    gridContainer.innerHTML = html;
    const cards = document.querySelectorAll('.service-card');
    const cardObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('animate-card'); });
    }, { threshold: 0.1 });
    cards.forEach(card => cardObserver.observe(card));
  }

  staticBtn.addEventListener('click', () => { if(currentCategory !== 'static') { currentCategory = 'static'; staticBtn.classList.add('active'); dynamicBtn.classList.remove('active'); renderServices(); } });
  dynamicBtn.addEventListener('click', () => { if(currentCategory !== 'dynamic') { currentCategory = 'dynamic'; dynamicBtn.classList.add('active'); staticBtn.classList.remove('active'); renderServices(); } });
  renderServices();

  // Text slider
  const words = ["Static Websites", "Dynamic Websites", "Ecommerce Solutions", "Booking Systems"];
  let widx = 0;
  const slidingSpan = document.getElementById('slidingWord');
  function rotateText() {
    widx = (widx + 1) % words.length;
    slidingSpan.style.opacity = '0';
    slidingSpan.style.transform = 'translateY(8px)';
    setTimeout(() => {
      slidingSpan.innerText = words[widx];
      slidingSpan.style.transition = 'all 0.3s';
      slidingSpan.style.opacity = '1';
      slidingSpan.style.transform = 'translateY(0)';
    }, 150);
  }
  setInterval(rotateText, 2200);

  // SCROLL ANIMATIONS - About section removed
  const footerSec = document.getElementById('footerSection');
  const scrollAnimObserver = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.2 });
  
  // Safe observation with null checks
  if(categoryWrapper) scrollAnimObserver.observe(categoryWrapper);
  if(footerSec) scrollAnimObserver.observe(footerSec);
  
  setTimeout(() => {
    if(categoryWrapper) categoryWrapper.classList.add('visible');
  }, 100);

  // navbar scroll
  window.addEventListener('scroll', () => {
    const nav = document.getElementById('navbar');
    if(window.scrollY > 20) nav.classList.add('scrolled');
    else nav.classList.remove('scrolled');
  });

  // MODAL LOGIC
  const modalOverlay = document.getElementById('orderModal');
  const orderNavBtn = document.getElementById('orderNavBtn');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const orderForm = document.getElementById('orderForm');
  const submitBtn = document.getElementById('submitBtn');
  const errorMsgDiv = document.getElementById('errorMsg');
  const errorTextSpan = document.getElementById('errorText');
  const successMsgDiv = document.getElementById('successMsg');
  function hideModalMessages() { errorMsgDiv.classList.remove('show'); successMsgDiv.classList.remove('show'); }
  function showModalError(msg) { hideModalMessages(); errorTextSpan.innerText = msg; errorMsgDiv.classList.add('show'); setTimeout(() => errorMsgDiv.classList.remove('show'), 5000); }
  function showModalSuccess() { hideModalMessages(); successMsgDiv.classList.add('show'); setTimeout(() => successMsgDiv.classList.remove('show'), 5000); }
  function resetBudgetFields() { document.getElementById('customBudget').value = ''; document.getElementById('selectedBudgetSpan').innerHTML = '<i class="fas fa-chart-line"></i> Selected budget: —'; document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active')); currentBudgetVal = null; }
  let currentBudgetVal = null;
  function updateBudgetDisplay(value) { if(value && !isNaN(value)) { document.getElementById('selectedBudgetSpan').innerHTML = `<i class="fas fa-chart-line"></i> Selected budget: ₹ ${parseInt(value).toLocaleString('en-IN')}`; currentBudgetVal = parseInt(value); } else { document.getElementById('selectedBudgetSpan').innerHTML = `<i class="fas fa-chart-line"></i> Selected budget: —`; currentBudgetVal = null; } }
  document.querySelectorAll('.preset-btn').forEach(btn => btn.addEventListener('click', (e) => { let val = parseInt(btn.getAttribute('data-value')); document.getElementById('customBudget').value = val; updateBudgetDisplay(val); document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }));
  document.getElementById('customBudget').addEventListener('input', function() { let val = this.value.trim(); if(val) updateBudgetDisplay(parseInt(val)); else updateBudgetDisplay(null); document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active')); });
  
  function resetForm() { orderForm.reset(); document.querySelectorAll('#pageNeedsGroup input').forEach(cb => cb.checked = false); document.querySelectorAll('#featuresGroup input').forEach(cb => cb.checked = false); document.querySelector('input[value="Statics"]').checked = true; updatePackageOptions(); resetBudgetFields(); document.getElementById('otherPages').value = ''; }
  function openModal() { hideModalMessages(); modalOverlay.classList.add('active'); document.body.style.overflow = 'hidden'; }
  function closeModal() { modalOverlay.classList.remove('active'); document.body.style.overflow = ''; resetForm(); }
  orderNavBtn.addEventListener('click', openModal);
  closeModalBtn.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeModal(); });
  
  const typeRadios = document.querySelectorAll('input[name="websiteType"]');
  const packageSelect = document.getElementById('packageSelect');
  function updatePackageOptions() {
    const selectedType = document.querySelector('input[name="websiteType"]:checked').value;
    const services = selectedType === 'Statics' ? staticServices : dynamicServices;
    packageSelect.innerHTML = '<option value="">-- Select a package --</option>';
    services.forEach(s => { let opt = document.createElement('option'); opt.value = s.url; opt.textContent = s.title; packageSelect.appendChild(opt); });
    if(packageSelect.options.length > 1) packageSelect.selectedIndex = 1;
  }
  typeRadios.forEach(r => r.addEventListener('change', updatePackageOptions));
  updatePackageOptions();

  orderForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const mobile = document.getElementById('mobile').value.trim();
    const email = document.getElementById('email').value.trim();
    const websiteName = document.getElementById('websiteName').value.trim();
    const websiteType = document.querySelector('input[name="websiteType"]:checked').value;
    const selectedPackageText = packageSelect.options[packageSelect.selectedIndex]?.text || '';
    const selectedPackageUrl = packageSelect.value;
    if(!currentBudgetVal) { showModalError('Please select or enter your budget.'); return; }
    const selectedPages = Array.from(document.querySelectorAll('#pageNeedsGroup input:checked')).map(cb => cb.value);
    let pagesNeeded = selectedPages.join(', ');
    const otherVal = document.getElementById('otherPages').value.trim();
    if(selectedPages.includes('Other') && otherVal) pagesNeeded += `, Other: ${otherVal}`;
    if(!pagesNeeded) { showModalError('Select at least one page.'); return; }
    if(!name || !mobile || !email || !websiteName) { showModalError('Fill all required fields.'); return; }
    if(!packageSelect.value) { showModalError('Select a package.'); return; }
    const features = Array.from(document.querySelectorAll('#featuresGroup input:checked')).map(cb => cb.value).join(', ') || 'None selected';
    const templateParams = { from_name: name, user_email: email, user_mobile: mobile, website_name: websiteName, website_type: websiteType, selected_package: `${selectedPackageText} (Preview: ${selectedPackageUrl})`, budget_range: `₹ ${currentBudgetVal.toLocaleString('en-IN')}`, pages_needed: pagesNeeded, features_required: features, description: document.getElementById('description').value || 'No additional details' };
    submitBtn.disabled = true; submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Sending...';
    try { await emailjs.send("service_snv7hbg", "template_x7cfn8f", templateParams); showModalSuccess(); resetForm(); setTimeout(() => closeModal(), 2000); } catch(err) { showModalError('Failed to send. Please try again.'); } finally { submitBtn.disabled = false; submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> <span>send request</span>'; }
  });

  window.addEventListener('load', () => { const loader = document.querySelector('.loading-overlay'); if(loader) { loader.classList.add('hidden'); setTimeout(() => loader.remove(), 400); } });
</script>
</body>
</html>
