<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Premium Web Work | Static & Dynamic</title>
  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
  <!-- Google Fonts + Font Awesome 6 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #4361ee;
      --purple: #7209b7;
      --accent: #06d6a0;
      --dark: #0b132b;
      --gray-dark: #4a4e69;
      --light: #f8f9fa;
      --white: #ffffff;
      --gradient: linear-gradient(135deg, #4361ee, #7209b7);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
      --radius: 20px;
      --radius-md: 14px;
      --transition: 0.25s ease;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4fa;
      color: var(--dark);
      line-height: 1.6;
    }

    /* loading overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s, visibility 0.4s;
    }
    .loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .loader {
      width: 60px;
      height: 60px;
      border: 5px solid #e9ecef;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* navbar */
    .navbar {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      padding: 12px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid rgba(0, 0, 0, 0.03);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.02);
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      font-family: 'Poppins', sans-serif;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.3px;
    }
    .order-nav-btn {
      background: var(--gradient);
      color: white;
      border: none;
      padding: 8px 22px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 10px rgba(67, 97, 238, 0.2);
    }
    .order-nav-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(67, 97, 238, 0.3);
    }

    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 30px 30px 50px;
    }

    /* hero */
    .hero-header {
      background: var(--white);
      border-radius: var(--radius);
      padding: 50px 30px;
      text-align: center;
      margin-bottom: 50px;
      box-shadow: var(--shadow-md);
    }
    .hero-badge {
      background: rgba(67, 97, 238, 0.1);
      color: var(--primary);
      font-weight: 600;
      font-size: 0.8rem;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      display: inline-block;
      margin-bottom: 1rem;
    }
    .hero-subtitle {
      color: var(--gray-dark);
      font-size: 1.1rem;
      max-width: 650px;
      margin: 1rem auto 1.8rem;
    }

    /* toggle buttons */
    .toggle-buttons {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 15px;
    }
    .toggle-btn {
      background: white;
      border: 1px solid #e2e8f0;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.7rem 1.8rem;
      border-radius: 60px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #1e293b;
    }
    .toggle-btn.active {
      background: var(--gradient);
      border-color: transparent;
      color: white;
      box-shadow: 0 8px 18px rgba(67, 97, 238, 0.3);
    }

    .category-title {
      text-align: center;
      margin: 0.5rem 0 2rem;
    }
    .category-title h3 {
      font-size: 1.8rem;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.7);
      display: inline-block;
      padding: 0.3rem 1.8rem;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border-left: 3px solid var(--primary);
      border-right: 3px solid var(--primary);
    }

    /* service cards grid */
    .services-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px;
      margin-top: 20px;
    }
    @media (max-width: 1100px) {
      .services-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .services-grid { grid-template-columns: 1fr; }
    }
    .service-card {
      background: var(--white);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      transition: var(--transition);
      display: flex;
      flex-direction: column;
    }
    .service-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 24px 36px -12px rgba(67, 97, 238, 0.2);
    }
    .card-image {
      height: 200px;
      overflow: hidden;
      background: #e2e8f0;
    }
    .card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .card-content {
      padding: 22px 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .service-card h4 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .service-card p {
      color: var(--gray-dark);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }
    .btn-preview {
      background: var(--gradient);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 40px;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      margin-top: auto;
    }
    .footer {
      background: var(--white);
      border-radius: var(--radius);
      padding: 40px 30px;
      text-align: center;
      margin-top: 60px;
    }

    /* MODAL STYLES */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--white);
      border-radius: 30px;
      width: 100%;
      max-width: 750px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 30px 60px rgba(0,0,0,0.3);
      transform: scale(0.95);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-overlay.active .modal { transform: scale(1); }
    .modal-header {
      padding: 26px;
      background: var(--gradient);
      color: white;
      position: relative;
      border-radius: 30px 30px 0 0;
      text-align: center;
    }
    .modal-title {
      font-size: 2rem;
      font-weight: 700;
      font-family: 'Poppins', sans-serif;
    }
    .close-modal {
      position: absolute;
      top: 18px;
      right: 20px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      font-size: 2rem;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
    }
    .modal-body { padding: 30px; }
    .form-group { margin-bottom: 20px; }
    .form-label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      color: var(--dark);
    }
    .form-control, .form-select {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e9ecef;
      border-radius: 18px;
      font-size: 1rem;
      background: #f8fafc;
    }
    .form-control:focus, .form-select:focus {
      outline: none;
      border-color: var(--primary);
    }

    /* budget section styles */
    .budget-options {
      background: #f9fbfe;
      border-radius: 24px;
      padding: 0.8rem 1rem;
      border: 1px solid #e9edf2;
      margin-top: 6px;
    }
    .preset-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }
    .preset-btn {
      background: white;
      border: 1.5px solid #dce5ec;
      border-radius: 40px;
      padding: 8px 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: #1f5e8c;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
    }
    .preset-btn i {
      font-size: 0.9rem;
    }
    .preset-btn.active {
      background: #1c3e55;
      border-color: #1c3e55;
      color: white;
    }
    .manual-budget {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .manual-budget label {
      margin: 0;
      font-weight: 500;
      font-size: 0.9rem;
    }
    .manual-budget input {
      flex: 1;
      min-width: 140px;
      padding: 10px 14px;
      border-radius: 40px;
      border: 1.5px solid #e0e7ef;
    }
    .budget-display {
      background: #eef3fc;
      display: inline-block;
      padding: 5px 15px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-top: 12px;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 8px;
    }
    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: normal;
      cursor: pointer;
    }
    .checkbox-group input {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }
    .radio-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: normal;
      cursor: pointer;
    }
    .package-select {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid #e9ecef;
      border-radius: 18px;
      font-size: 1rem;
      background: #f8fafc;
    }
    .btn-submit {
      width: 100%;
      padding: 18px;
      background: var(--gradient);
      border: none;
      border-radius: 40px;
      color: white;
      font-weight: 700;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 12px;
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-submit.loading span { visibility: hidden; }
    .btn-submit.loading::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      border: 3px solid white;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s infinite;
    }
    .error-message, .success-message {
      display: none;
      padding: 14px 18px;
      border-radius: 16px;
      margin-bottom: 25px;
      font-weight: 500;
    }
    .error-message {
      background: #ffe9e9;
      color: #b00020;
      border-left: 5px solid #ff6b6b;
    }
    .success-message {
      background: #e3f9ed;
      color: #0b5e42;
      border-left: 5px solid #06d6a0;
    }
    .error-message.show, .success-message.show { display: block; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fadeUp 0.35s ease forwards; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="logo">✦ Premium Work</div>
  <button id="orderNavBtn" class="order-nav-btn"><i class="fas fa-pen"></i> Order now</button>
</nav>

<main class="container">
  <div class="hero-header">
    <div class="hero-badge"><i class="fas fa-crown"></i> Premium web work</div>
    <p class="hero-subtitle">Static Foundations. Dynamic Engines. Tailor-Made Digital Solutions with Live Preview 🚀</p>
    <div class="toggle-buttons">
      <button id="staticToggleBtn" class="toggle-btn active"><i class="fas fa-layer-group"></i> Statics</button>
      <button id="dynamicToggleBtn" class="toggle-btn"><i class="fas fa-bolt"></i> Dynamic</button>
    </div>
  </div>
  <div class="category-title"><h3 id="categoryDynamicTitle">📁 Static Solutions</h3></div>
  <div id="servicesGridContainer" class="services-grid"></div>
</main>

<footer class="footer">
  <p><i class="fas fa-code"></i> © 2026 ProDeveloping – Premium Web Work</p>
</footer>

<!-- ORDER MODAL with enhanced package selection -->
<div class="modal-overlay" id="orderModal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title">Custom Website Order</h2>
      <button class="close-modal" id="closeModalBtn">&times;</button>
    </div>
    <div class="modal-body">
      <div id="errorMsg" class="error-message"><i class="fas fa-exclamation-circle"></i> <span id="errorText"></span></div>
      <div id="successMsg" class="success-message"><i class="fas fa-check-circle"></i> ✅ request sent! we'll contact you soon.</div>

      <form id="orderForm">
        <!-- Client Details -->
        <div class="form-group">
          <label class="form-label">Your Name *</label>
          <input type="text" id="name" class="form-control" placeholder="Full name" required>
        </div>
        <div class="form-group">
          <label class="form-label">Mobile Number *</label>
          <input type="tel" id="mobile" class="form-control" placeholder="+91 9876543210" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address *</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>

        <!-- Website Details -->
        <div class="form-group">
          <label class="form-label">Website Name *</label>
          <input type="text" id="websiteName" class="form-control" placeholder="e.g., MyBusinessHub" required>
        </div>
        <div class="form-group">
          <label class="form-label">Website Type *</label>
          <div class="radio-group" id="typeRadioGroup">
            <label><input type="radio" name="websiteType" value="Statics" checked> Statics</label>
            <label><input type="radio" name="websiteType" value="Dynamic"> Dynamic</label>
          </div>
        </div>

        <!-- Dynamic Package Selection (based on chosen type) -->
        <div class="form-group">
          <label class="form-label">Select Website Package *</label>
          <select id="packageSelect" class="package-select" required>
            <option value="">-- Select a package --</option>
          </select>
          <div id="packagePreviewLink" style="margin-top: 8px; font-size: 0.85rem;"></div>
        </div>

        <!-- BUDGET SECTION: preset 2k,5k,10k + manual -->
        <div class="form-group">
          <label class="form-label"><i class="fas fa-coins"></i> Budget range (INR) *</label>
          <div class="budget-options">
            <div class="preset-buttons">
              <button type="button" class="preset-btn" data-value="2000"><i class="fas fa-rupee-sign"></i> 2,000</button>
              <button type="button" class="preset-btn" data-value="5000"><i class="fas fa-rupee-sign"></i> 5,000</button>
              <button type="button" class="preset-btn" data-value="10000"><i class="fas fa-rupee-sign"></i> 10,000</button>
            </div>
            <div class="manual-budget">
              <label><i class="fas fa-edit"></i> Custom amount:</label>
              <input type="number" id="customBudget" placeholder="Enter any amount (₹)" step="1000" min="0">
            </div>
            <div class="budget-display">
              <i class="fas fa-chart-line"></i> Selected budget: <span id="selectedBudgetSpan">—</span>
            </div>
          </div>
        </div>

        <!-- Page Needs (checkboxes) -->
        <div class="form-group">
          <label class="form-label">Pages Needed * (select at least one)</label>
          <div class="checkbox-group" id="pageNeedsGroup">
            <label><input type="checkbox" value="Home"> Home</label>
            <label><input type="checkbox" value="About"> About</label>
            <label><input type="checkbox" value="Services"> Services</label>
            <label><input type="checkbox" value="Products"> Products</label>
            <label><input type="checkbox" value="Contact"> Contact</label>
            <label><input type="checkbox" value="Gallery"> Gallery</label>
            <label><input type="checkbox" value="Blog"> Blog</label>
            <label><input type="checkbox" value="Other"> Other</label>
          </div>
          <input type="text" id="otherPages" class="form-control" style="margin-top:10px;" placeholder="If 'Other', specify pages">
        </div>

        <!-- Features Required (checkboxes) -->
        <div class="form-group">
          <label class="form-label">Features Required (select all that apply)</label>
          <div class="checkbox-group" id="featuresGroup">
            <label><input type="checkbox" value="Contact form"> Contact form</label>
            <label><input type="checkbox" value="WhatsApp button"> WhatsApp button</label>
            <label><input type="checkbox" value="Payment gateway"> Payment gateway</label>
            <label><input type="checkbox" value="Admin panel"> Admin panel</label>
            <label><input type="checkbox" value="Notification system"> Notification system</label>
            <label><input type="checkbox" value="Login system"> Login system</label>
            <label><input type="checkbox" value="Order system"> Order system</label>
          </div>
        </div>

        <!-- Additional info -->
        <div class="form-group">
          <label class="form-label">Additional Description / Requirements</label>
          <textarea id="description" class="form-control" rows="4" placeholder="Any specific design, colors, functionality..."></textarea>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn"><i class="fas fa-paper-plane"></i> <span>send request</span></button>
      </form>
    </div>
  </div>
</div>

<script>
  // EmailJS init with your public key
  (function() {
    emailjs.init("FfnVW2oPii98q0uHl");
  })();

  // Static & Dynamic services data (URLs corrected to prodeveloping)
  const staticServices = [
    { title: "Portfolio Website", desc: "Showcase your creativity with a stunning portfolio.", image: "https://images.unsplash.com/photo-1551650975-87deedd944c3?w=600&auto=format", url: "https://prodeveloping.github.io/Demo1/" },
    { title: "Business Website", desc: "Professional corporate presence with lead generation.", image: "https://picsum.photos/id/48/600/400", url: "https://prodeveloping.github.io/Demo2/" },
    { title: "Landing Page Design", desc: "High-conversion landing pages for campaigns.", image: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=600&auto=format", url: "https://prodeveloping.github.io/Demo3/" },
    { title: "Education information Website", desc: "Lightning-fast static sites, SEO-friendly.", image: "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=600&auto=format", }
  ];
  const dynamicServices = [
    { title: "Ecommerce website ", desc: "Scalable full-stack apps with real-time data.", image: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=600&auto=format", url: "https://prodeveloping.github.io/Demo1/" },
    { title: "Booking system Website", desc: "Complete online stores with cart & payment.", image: "https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?w=600&auto=format", url: "https://prodeveloping.github.io/Demo2/" },
    { title: "Admin panel website", desc: "Dynamic content management with admin panel.", image: "https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=600&auto=format", url: "https://prodeveloping.github.io/Demo3/" },
    { title: "Hospital manegement website", desc: "Interactive dashboards with charts & analytics.", image: "https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=600&auto=format", url: "https://prodeveloping.github.io/Demo4/" }
  ];

  let currentCategory = 'static';
  const staticBtn = document.getElementById('staticToggleBtn');
  const dynamicBtn = document.getElementById('dynamicToggleBtn');
  const categoryTitle = document.getElementById('categoryDynamicTitle');
  const gridContainer = document.getElementById('servicesGridContainer');

  // ---------- UPDATED renderServices() function ----------
  // Only the first service card (index === 0) shows the Live Preview button.
  // All other cards have no button (empty placeholder or no button element).
  function renderServices() {
    const services = currentCategory === 'static' ? staticServices : dynamicServices;
    categoryTitle.textContent = currentCategory === 'static' ? '📁 Static Solutions' : '⚡ Dynamic Solutions';
    let html = '';
    services.forEach((s, index) => {
      html += `
        <div class="service-card fade-up">
          <div class="card-image"><img src="${s.image}" alt="${s.title}"></div>
          <div class="card-content">
            <h4>${s.title}</h4>
            <p>${s.desc}</p>
      `;
      // Condition: only show Live Preview button for the first service (index === 0)
      if (index === 0) {
        html += `<a class="btn-preview" href="${s.url}" target="_blank" rel="noopener noreferrer"><i class="fas fa-eye"></i> Live Preview</a>`;
      } else {
  html += ``;
}
      html += `</div></div>`;
    });
    gridContainer.innerHTML = html;
  }
  // ---------- end of updated function ----------

  staticBtn.addEventListener('click', () => { if(currentCategory !== 'static') { currentCategory = 'static'; staticBtn.classList.add('active'); dynamicBtn.classList.remove('active'); renderServices(); } });
  dynamicBtn.addEventListener('click', () => { if(currentCategory !== 'dynamic') { currentCategory = 'dynamic'; dynamicBtn.classList.add('active'); staticBtn.classList.remove('active'); renderServices(); } });
  renderServices();

  // ---------- Dynamic Package Selection Logic (unchanged) ----------
  const typeRadios = document.querySelectorAll('input[name="websiteType"]');
  const packageSelect = document.getElementById('packageSelect');
  const packagePreviewLink = document.getElementById('packagePreviewLink');
  let selectedPackageUrl = '';

  function updatePackageOptions() {
    const selectedType = document.querySelector('input[name="websiteType"]:checked').value;
    const services = selectedType === 'Statics' ? staticServices : dynamicServices;
    packageSelect.innerHTML = '<option value="">-- Select a package --</option>';
    services.forEach((service, idx) => {
      const option = document.createElement('option');
      option.value = service.url;
      option.textContent = service.title;
      option.setAttribute('data-desc', service.desc);
      packageSelect.appendChild(option);
    });
    packagePreviewLink.innerHTML = '';
    selectedPackageUrl = '';
    if (packageSelect.options.length > 1) {
      packageSelect.selectedIndex = 1;
      packageSelect.dispatchEvent(new Event('change'));
    }
  }

  packageSelect.addEventListener('change', function() {
  const selectedOption = packageSelect.options[packageSelect.selectedIndex];
  if (selectedOption && selectedOption.value) {
    selectedPackageUrl = selectedOption.value;
    packagePreviewLink.innerHTML = '';
  } else {
    selectedPackageUrl = '';
    packagePreviewLink.innerHTML = '';
  }
});

  typeRadios.forEach(radio => {
    radio.addEventListener('change', () => {
      updatePackageOptions();
    });
  });

  updatePackageOptions();

  // ---------- BUDGET LOGIC (unchanged) ----------
  const presetBtns = document.querySelectorAll('.preset-btn');
  const customInput = document.getElementById('customBudget');
  const selectedBudgetSpan = document.getElementById('selectedBudgetSpan');
  let currentBudget = null;

  function updateBudgetDisplay(value) {
    if (value === null || value === '') {
      selectedBudgetSpan.innerText = '—';
      currentBudget = null;
      return;
    }
    let num = parseInt(value);
    if (isNaN(num)) {
      selectedBudgetSpan.innerText = '—';
      currentBudget = null;
      return;
    }
    selectedBudgetSpan.innerText = `₹ ${num.toLocaleString('en-IN')}`;
    currentBudget = num;
  }

  function setActivePreset(value) {
    presetBtns.forEach(btn => {
      const btnVal = parseInt(btn.getAttribute('data-value'));
      if (btnVal === value) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    });
  }

  function handlePresetClick(e) {
    const val = parseInt(e.currentTarget.getAttribute('data-value'));
    customInput.value = val;
    updateBudgetDisplay(val);
    setActivePreset(val);
  }

  presetBtns.forEach(btn => btn.addEventListener('click', handlePresetClick));

  customInput.addEventListener('input', function() {
    let raw = this.value.trim();
    if (raw === '') {
      updateBudgetDisplay(null);
      setActivePreset(null);
      return;
    }
    let num = parseInt(raw);
    if (!isNaN(num)) {
      updateBudgetDisplay(num);
      let matched = false;
      presetBtns.forEach(btn => {
        if (parseInt(btn.getAttribute('data-value')) === num) {
          setActivePreset(num);
          matched = true;
        }
      });
      if (!matched) setActivePreset(null);
    } else {
      updateBudgetDisplay(null);
      setActivePreset(null);
    }
  });

  // ---------- MODAL LOGIC (unchanged) ----------
  const modalOverlay = document.getElementById('orderModal');
  const orderNavBtn = document.getElementById('orderNavBtn');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const orderForm = document.getElementById('orderForm');
  const submitBtn = document.getElementById('submitBtn');
  const errorMsgDiv = document.getElementById('errorMsg');
  const errorTextSpan = document.getElementById('errorText');
  const successMsgDiv = document.getElementById('successMsg');

  function hideModalMessages() { errorMsgDiv.classList.remove('show'); successMsgDiv.classList.remove('show'); }
  function showModalError(msg) { hideModalMessages(); errorTextSpan.innerText = msg; errorMsgDiv.classList.add('show'); setTimeout(() => errorMsgDiv.classList.remove('show'), 5000); }
  function showModalSuccess() { hideModalMessages(); successMsgDiv.classList.add('show'); setTimeout(() => successMsgDiv.classList.remove('show'), 5000); }
  function resetBudget() {
    customInput.value = '';
    updateBudgetDisplay(null);
    setActivePreset(null);
  }
  function resetFormFields() {
    orderForm.reset();
    document.querySelectorAll('#pageNeedsGroup input[type="checkbox"]').forEach(cb => cb.checked = false);
    document.querySelectorAll('#featuresGroup input[type="checkbox"]').forEach(cb => cb.checked = false);
    document.querySelector('input[value="Statics"]').checked = true;
    updatePackageOptions();
    resetBudget();
  }
  function openModal() { hideModalMessages(); modalOverlay.classList.add('active'); document.body.style.overflow = 'hidden'; }
  function closeModal() {
    modalOverlay.classList.remove('active');
    document.body.style.overflow = '';
    resetFormFields();
    submitBtn.disabled = false;
    submitBtn.classList.remove('loading');
  }
  orderNavBtn.addEventListener('click', openModal);
  closeModalBtn.addEventListener('click', closeModal);
  modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeModal(); });

  orderForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    hideModalMessages();

    const name = document.getElementById('name').value.trim();
    const mobile = document.getElementById('mobile').value.trim();
    const email = document.getElementById('email').value.trim();
    const websiteName = document.getElementById('websiteName').value.trim();
    const websiteType = document.querySelector('input[name="websiteType"]:checked').value;
    const selectedPackageText = packageSelect.options[packageSelect.selectedIndex]?.text || '';
    const selectedPackageUrl = packageSelect.value;

    if (currentBudget === null || isNaN(currentBudget)) {
      showModalError('Please select or enter your budget (2k, 5k, 10k or custom amount).');
      return;
    }
    const budgetValue = `₹ ${currentBudget.toLocaleString('en-IN')}`;

    const pageCheckboxes = document.querySelectorAll('#pageNeedsGroup input[type="checkbox"]:checked');
    let selectedPages = Array.from(pageCheckboxes).map(cb => cb.value);
    const otherPagesInput = document.getElementById('otherPages').value.trim();
    if (selectedPages.includes('Other') && otherPagesInput) selectedPages.push(`Other: ${otherPagesInput}`);
    const pagesNeeded = selectedPages.length ? selectedPages.join(', ') : '';

    const featureCheckboxes = document.querySelectorAll('#featuresGroup input[type="checkbox"]:checked');
    const featuresRequired = Array.from(featureCheckboxes).map(cb => cb.value).join(', ') || 'None selected';
    
    const description = document.getElementById('description').value.trim();

    if (!name || !mobile || !email || !websiteName || !pagesNeeded) {
      showModalError('Please fill all required fields: Name, Mobile, Email, Website Name, and at least one Page.');
      return;
    }
    if (!/^\S+@\S+\.\S+$/.test(email)) { showModalError('Enter a valid email address.'); return; }
    if (mobile.length < 8) { showModalError('Mobile number must be at least 8 digits.'); return; }
    if (!packageSelect.value) {
      showModalError('Please select a website package.');
      return;
    }

    const templateParams = {
      from_name: name,
      user_email: email,
      user_mobile: mobile,
      website_name: websiteName,
      website_type: websiteType,
      selected_package: `${selectedPackageText} (Preview: ${selectedPackageUrl})`,
      budget_range: budgetValue,
      pages_needed: pagesNeeded,
      features_required: featuresRequired,
      description: description || 'No additional details',
    };

    submitBtn.disabled = true;
    submitBtn.classList.add('loading');
    try {
      await emailjs.send("service_snv7hbg", "template_x7cfn8f", templateParams);
      showModalSuccess();
      resetFormFields();
      setTimeout(() => { if(modalOverlay.classList.contains('active')) closeModal(); }, 2500);
    } catch(err) {
      console.error(err);
      showModalError('Failed to send. Please check your connection or try again later.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.classList.remove('loading');
    }
  });

  window.addEventListener('load', () => {
    const loader = document.querySelector('.loading-overlay');
    if(loader) {
      loader.classList.add('hidden');
      setTimeout(() => loader.remove(), 400);
    }
  });
</script>
</body>
</html>
