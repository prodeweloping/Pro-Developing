<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Entry · with local storage</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #e0e7ff 0%, #f9fafb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
      width: 100%;
      max-width: 420px;
      padding: 2rem 1.8rem;
      border-radius: 32px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.5);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: scale(1.01);
    }

    h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #4b5563;
      margin-bottom: 0.3rem;
      margin-top: 1.2rem;
    }

    h3:first-of-type {
      margin-top: 0;
    }

    .input-field {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid #d1d5db;
      border-radius: 20px;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      background: white;
    }

    .input-field:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 4px rgba(139,92,246,0.2);
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      border: none;
      padding: 0.9rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 40px;
      margin: 1.8rem 0 1.5rem 0;
      cursor: pointer;
      box-shadow: 0 8px 20px -5px rgba(99,102,241,0.5);
      transition: all 0.2s;
    }

    button:hover {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      transform: translateY(-2px);
      box-shadow: 0 12px 25px -5px rgba(79,70,229,0.6);
    }

    button:active {
      transform: translateY(1px);
      box-shadow: 0 4px 12px -5px #4f46e5;
    }

    .balance-container {
      background: #f1f5f9;
      padding: 1.2rem;
      border-radius: 24px;
      text-align: center;
      margin-bottom: 1.8rem;
      border: 1px solid #e2e8f0;
    }

    .balance-label {
      font-size: 0.9rem;
      color: #475569;
      letter-spacing: 0.5px;
    }

    .balance-value {
      font-size: 2.6rem;
      font-weight: 700;
      line-height: 1.2;
      /* 👇 HIGHLIGHT EFFECT */
      color: #7c3aed;
      text-shadow: 0 0 8px rgba(124,58,237,0.5);
      transition: text-shadow 0.2s;
    }

    .balance-value:hover {
      text-shadow: 0 0 12px rgba(124,58,237,0.8);
    }

    .balance-value::before {
      content: '₹';
      font-size: 1.8rem;
      font-weight: 500;
      color: #64748b;
      margin-right: 4px;
      text-shadow: none;
    }

    .entry-list {
      margin-top: 1.5rem;
      max-height: 280px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .entry-item {
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.2rem;
      border-radius: 50px;
      margin-bottom: 0.7rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      border: 1px solid #f1f5f9;
      transition: background 0.2s;
    }

    .entry-item:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .entry-name {
      font-weight: 500;
      color: #1e293b;
    }

    .entry-amount {
      background: #fee2e2;
      color: #b91c1c;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .entry-amount::before {
      content: '- ₹';
    }

    @media (max-width: 400px) {
      .card { padding: 1.5rem; }
      .balance-value { font-size: 2rem; }
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body>
  <div class="card">
    <h3>💰 Current balance</h3>
    <input type="number" id="balanceInput" class="input-field" placeholder="Set initial balance" value="0">

    <h3>🧑 Person name</h3>
    <input type="text" id="nameInput" class="input-field" placeholder="Enter name">

    <h3>💸 Amount</h3>
    <input type="number" id="amountInput" class="input-field" placeholder="Expense amount">

    <button onclick="addEntry()">➕ Add entry</button>

    <div class="balance-container">
      <div class="balance-label">remaining balance</div>
      <div class="balance-value" id="balanceShow">0</div>
    </div>

    <div id="entryList" class="entry-list"></div>
  </div>

  <script>
    // Data structure
    let balance = 0;
    let entries = [];  // each entry: { name, amount }

    // DOM elements
    const balanceInput = document.getElementById('balanceInput');
    const nameInput = document.getElementById('nameInput');
    const amountInput = document.getElementById('amountInput');
    const balanceShow = document.getElementById('balanceShow');
    const entryListDiv = document.getElementById('entryList');

    // ==== LOCAL STORAGE KEY ====
    const STORAGE_KEY = 'moneyTracker';

    // ==== Load saved data on page start ====
    function loadFromStorage() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const data = JSON.parse(saved);
          balance = data.balance || 0;
          entries = data.entries || [];

          // Update input field to show current balance
          balanceInput.value = balance;

          // Update displayed balance
          balanceShow.innerText = balance;

          // Rebuild entry list from entries array
          renderEntries();
        } catch (e) {
          console.warn('Failed to load saved data', e);
        }
      } else {
        // No saved data: start fresh with balance 0
        balance = 0;
        entries = [];
        balanceInput.value = 0;
        balanceShow.innerText = 0;
      }
    }

    // ==== Save current state to localStorage ====
    function saveToStorage() {
      const data = {
        balance: balance,
        entries: entries
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // ==== Render the entry list from the entries array ====
    function renderEntries() {
      entryListDiv.innerHTML = ''; // clear
      entries.forEach(entry => {
        const entryDiv = document.createElement('div');
        entryDiv.className = 'entry-item';
        entryDiv.innerHTML = `
          <span class="entry-name">${escapeHtml(entry.name)}</span>
          <span class="entry-amount">${entry.amount}</span>
        `;
        entryListDiv.appendChild(entryDiv);
      });
    }

    // Simple escape to prevent XSS (though we trust input, it's good practice)
    function escapeHtml(unsafe) {
      return unsafe.replace(/[&<>"]/g, function(m) {
        if(m === '&') return '&amp;';
        if(m === '<') return '&lt;';
        if(m === '>') return '&gt;';
        if(m === '"') return '&quot;';
        return m;
      });
    }

    // ==== Add new entry ====
    function addEntry() {
      // If balance is 0, we allow using the value from balanceInput as the starting balance
      // (useful for very first entry or if user manually sets a new base)
      if (balance === 0) {
        const newBalance = Number(balanceInput.value);
        if (!isNaN(newBalance) && newBalance >= 0) {
          balance = newBalance;
        } else {
          balance = 0;
        }
        balanceShow.innerText = balance;
      }

      const name = nameInput.value.trim();
      const amount = Number(amountInput.value);

      // Validation
      if (name === '') {
        alert('Please enter a name');
        return;
      }
      if (isNaN(amount) || amount <= 0) {
        alert('Amount must be a positive number');
        return;
      }
      if (amount > balance) {
        alert('Insufficient balance!');
        return;
      }

      // Deduct from balance
      balance = balance - amount;
      balanceShow.innerText = balance;
      balanceInput.value = balance;   // also update the input field

      // Add to entries array
      entries.push({ name, amount });

      // Add to DOM
      const entryDiv = document.createElement('div');
      entryDiv.className = 'entry-item';
      entryDiv.innerHTML = `
        <span class="entry-name">${escapeHtml(name)}</span>
        <span class="entry-amount">${amount}</span>
      `;
      entryListDiv.appendChild(entryDiv);

      // Save to localStorage
      saveToStorage();

      // Clear inputs and focus name for next entry
      nameInput.value = '';
      amountInput.value = '';
      nameInput.focus();
    }

    // Optionally, you could allow manual balance change via the input field.
    // But to keep things consistent, we only change balance through entries.
    // However, if the user types a new number in the balance input, we could update the balance?
    // That might cause inconsistency with entries. For simplicity, we disable that.
    // But we'll leave the input as a display of current balance (it's updated after each entry).
    // If you want to allow resetting, you could add a "Set new balance" button. Let me know!

    // Load data when page loads
    window.addEventListener('load', loadFromStorage);
  </script>
</body>
  </html>
