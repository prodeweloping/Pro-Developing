<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💰 money tracker · edit + delete</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #e0e7ff 0%, #f9fafb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(4px);
      width: 100%;
      max-width: 480px;
      padding: 2rem 1.8rem;
      border-radius: 32px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.5);
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: scale(1.01);
    }

    h3 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #4b5563;
      margin-bottom: 0.3rem;
      margin-top: 1.2rem;
    }

    h3:first-of-type {
      margin-top: 0;
    }

    .input-field {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid #d1d5db;
      border-radius: 20px;
      font-size: 1rem;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      background: white;
    }

    .input-field:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 4px rgba(139,92,246,0.2);
    }

    .button-group {
      display: flex;
      gap: 0.75rem;
      margin: 1.8rem 0 1.5rem 0;
    }

    .primary-btn {
      flex: 1;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      color: white;
      border: none;
      padding: 0.9rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 8px 20px -5px rgba(99,102,241,0.5);
      transition: all 0.2s;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .primary-btn:hover {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      transform: translateY(-2px);
      box-shadow: 0 12px 25px -5px rgba(79,70,229,0.6);
    }

    .primary-btn:active {
      transform: translateY(1px);
      box-shadow: 0 4px 12px -5px #4f46e5;
    }

    .secondary-btn {
      background: #f1f5f9;
      color: #1e293b;
      border: 1px solid #cbd5e1;
      padding: 0.9rem 1.2rem;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 40px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .secondary-btn:hover {
      background: #e2e8f0;
      border-color: #94a3b8;
    }

    .balance-container {
      background: #f1f5f9;
      padding: 1.2rem;
      border-radius: 24px;
      text-align: center;
      margin-bottom: 1.8rem;
      border: 1px solid #e2e8f0;
    }

    .balance-label {
      font-size: 0.9rem;
      color: #475569;
      letter-spacing: 0.5px;
    }

    .balance-value {
      font-size: 2.6rem;
      font-weight: 700;
      line-height: 1.2;
      color: #7c3aed;
      text-shadow: 0 0 8px rgba(124,58,237,0.5);
      transition: text-shadow 0.2s;
    }

    .balance-value:hover {
      text-shadow: 0 0 12px rgba(124,58,237,0.8);
    }

    .balance-value::before {
      content: '₹';
      font-size: 1.8rem;
      font-weight: 500;
      color: #64748b;
      margin-right: 4px;
      text-shadow: none;
    }

    .entry-list {
      margin-top: 1.5rem;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 6px;
    }

    .entry-item {
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 1rem 0.6rem 1.2rem;
      border-radius: 40px;
      margin-bottom: 0.7rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      border: 1px solid #f1f5f9;
      transition: background 0.15s, border-color 0.15s;
    }

    .entry-item:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .entry-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .entry-name {
      font-weight: 600;
      color: #1e293b;
      background: #f1f4f9;
      padding: 0.2rem 0.9rem;
      border-radius: 40px;
      font-size: 0.9rem;
    }

    .entry-amount {
      background: #fee2e2;
      color: #b91c1c;
      padding: 0.2rem 1rem;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
    }

    .entry-amount::before {
      content: '- ₹';
    }

    .entry-actions {
      display: flex;
      gap: 0.3rem;
    }

    .icon-btn {
      background: transparent;
      border: none;
      font-size: 1.3rem;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      border-radius: 30px;
      transition: background 0.15s, transform 0.1s;
      line-height: 1;
      color: #4b5563;
    }

    .icon-btn:hover {
      background: #e2e8f0;
      transform: scale(1.1);
    }

    .icon-btn.edit:hover {
      color: #2563eb;
    }

    .icon-btn.delete:hover {
      color: #dc2626;
    }

    .edit-indicator {
      background: #fef9c3;
      color: #854d0e;
      padding: 0.3rem 1rem;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      display: inline-block;
      margin-right: 0.8rem;
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body>
  <div class="card">
    <h3>💰 Current balance</h3>
    <input type="number" id="balanceInput" class="input-field" placeholder="Set initial balance" value="0">

    <h3>🧑 Person name</h3>
    <input type="text" id="nameInput" class="input-field" placeholder="Enter name">

    <h3>💸 Amount</h3>
    <input type="number" id="amountInput" class="input-field" placeholder="Expense amount">

    <!-- dynamic button area: add + cancel edit (if editing) -->
    <div class="button-group" id="actionButtonGroup">
      <button class="primary-btn" id="mainActionBtn" onclick="handleMainAction()">➕ Add entry</button>
      <button class="secondary-btn" id="cancelEditBtn" onclick="cancelEdit()" style="display: none;">✖ Cancel</button>
    </div>

    <div class="balance-container">
      <div class="balance-label">remaining balance</div>
      <div class="balance-value" id="balanceShow">0</div>
    </div>

    <div id="entryList" class="entry-list"></div>
  </div>

  <script>
    (function() {
      // --- data ---
      let balance = 0;
      let entries = [];               // { id, name, amount }

      // --- editing state ---
      let editingId = null;            // if set, we are updating that entry

      // DOM elements
      const balanceInput = document.getElementById('balanceInput');
      const nameInput = document.getElementById('nameInput');
      const amountInput = document.getElementById('amountInput');
      const balanceShow = document.getElementById('balanceShow');
      const entryListDiv = document.getElementById('entryList');
      const mainActionBtn = document.getElementById('mainActionBtn');
      const cancelEditBtn = document.getElementById('cancelEditBtn');

      const STORAGE_KEY = 'moneyTrackerAdvanced';

      // --- unique id generator ---
      function generateId() {
        return Date.now() + '-' + Math.random().toString(36).substring(2, 8);
      }

      // --- load / save storage ---
      function loadFromStorage() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            const data = JSON.parse(saved);
            balance = data.balance || 0;
            // ensure entries have ids (migrate old data if needed)
            if (data.entries && Array.isArray(data.entries)) {
              entries = data.entries.map(e => {
                if (!e.id) {
                  e.id = generateId();   // add id to old entries
                }
                return e;
              });
            } else {
              entries = [];
            }
          } catch (e) {
            console.warn('storage error', e);
            resetToDefaults();
          }
        } else {
          resetToDefaults();
        }

        // sync inputs and UI
        balanceInput.value = balance;
        balanceShow.innerText = balance;
        renderEntries();
      }

      function resetToDefaults() {
        balance = 0;
        entries = [];
      }

      function saveToStorage() {
        const data = { balance, entries };
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }

      // --- escape html (for safety) ---
      function escapeHtml(unsafe) {
        return unsafe.replace(/[&<>"]/g, function(m) {
          if (m === '&') return '&amp;';
          if (m === '<') return '&lt;';
          if (m === '>') return '&gt;';
          if (m === '"') return '&quot;';
          return m;
        });
      }

      // --- render entries (with edit/delete icons) ---
      function renderEntries() {
        entryListDiv.innerHTML = '';
        if (entries.length === 0) {
          entryListDiv.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:1rem;">✨ No entries yet</div>';
          return;
        }

        entries.forEach(entry => {
          const entryDiv = document.createElement('div');
          entryDiv.className = 'entry-item';
          entryDiv.dataset.id = entry.id;

          const infoDiv = document.createElement('div');
          infoDiv.className = 'entry-info';

          const nameSpan = document.createElement('span');
          nameSpan.className = 'entry-name';
          nameSpan.innerText = escapeHtml(entry.name);

          const amountSpan = document.createElement('span');
          amountSpan.className = 'entry-amount';
          amountSpan.innerText = entry.amount;   // amount shown with prefix via CSS

          infoDiv.appendChild(nameSpan);
          infoDiv.appendChild(amountSpan);

          const actionsDiv = document.createElement('div');
          actionsDiv.className = 'entry-actions';

          // edit button
          const editBtn = document.createElement('button');
          editBtn.className = 'icon-btn edit';
          editBtn.innerHTML = '✏️';
          editBtn.setAttribute('aria-label', 'edit');
          editBtn.onclick = (e) => {
            e.stopPropagation();
            startEditEntry(entry.id);
          };

          // delete button
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'icon-btn delete';
          deleteBtn.innerHTML = '🗑️';
          deleteBtn.setAttribute('aria-label', 'delete');
          deleteBtn.onclick = (e) => {
            e.stopPropagation();
            deleteEntry(entry.id);
          };

          actionsDiv.appendChild(editBtn);
          actionsDiv.appendChild(deleteBtn);

          entryDiv.appendChild(infoDiv);
          entryDiv.appendChild(actionsDiv);
          entryListDiv.appendChild(entryDiv);
        });
      }

      // --- cancel edit mode ---
      function cancelEdit() {
        editingId = null;
        nameInput.value = '';
        amountInput.value = '';
        mainActionBtn.innerHTML = '➕ Add entry';
        cancelEditBtn.style.display = 'none';
        nameInput.focus();
      }

      // --- start editing an entry ---
      function startEditEntry(id) {
        const entry = entries.find(e => e.id === id);
        if (!entry) return;

        editingId = id;
        nameInput.value = entry.name;
        amountInput.value = entry.amount;
        mainActionBtn.innerHTML = '✏️ Update entry';
        cancelEditBtn.style.display = 'inline-block';
        nameInput.focus();
      }

      // --- handle main button (add or update) ---
      function handleMainAction() {
        // if editingId is set → update, otherwise add
        if (editingId) {
          updateEntry();
        } else {
          addEntry();
        }
      }

      // --- ADD new entry ---
      function addEntry() {
        // If balance is zero and user wants to set a starting balance, allow it
        if (balance === 0) {
          const newBalance = Number(balanceInput.value);
          if (!isNaN(newBalance) && newBalance >= 0) {
            balance = newBalance;
          } else {
            balance = 0;
          }
          balanceShow.innerText = balance;
        }

        const name = nameInput.value.trim();
        const amount = Number(amountInput.value);

        if (name === '') {
          alert('Please enter a name');
          return;
        }
        if (isNaN(amount) || amount <= 0) {
          alert('Amount must be a positive number');
          return;
        }
        if (amount > balance) {
          alert('Insufficient balance!');
          return;
        }

        // deduct from balance
        balance = balance - amount;
        balanceShow.innerText = balance;
        balanceInput.value = balance;

        // create entry with unique id
        const newEntry = {
          id: generateId(),
          name: name,
          amount: amount
        };
        entries.push(newEntry);

        // persist
        saveToStorage();
        renderEntries();

        // clear inputs, keep focus
        nameInput.value = '';
        amountInput.value = '';
        nameInput.focus();
      }

      // --- UPDATE existing entry (called from edit mode) ---
      function updateEntry() {
        if (!editingId) return;

        const oldEntry = entries.find(e => e.id === editingId);
        if (!oldEntry) {
          cancelEdit();
          return;
        }

        const newName = nameInput.value.trim();
        const newAmount = Number(amountInput.value);

        // validation
        if (newName === '') {
          alert('Name cannot be empty');
          return;
        }
        if (isNaN(newAmount) || newAmount <= 0) {
          alert('Amount must be positive');
          return;
        }

        // calculate balance effect: refund old amount, then subtract new amount
        const oldAmount = oldEntry.amount;
        const balanceAfterRefund = balance + oldAmount;   // we temporarily add back

        if (newAmount > balanceAfterRefund) {
          alert('Insufficient balance for this update');
          return;
        }

        // apply new balance
        balance = balanceAfterRefund - newAmount;
        balanceShow.innerText = balance;
        balanceInput.value = balance;

        // update entry
        oldEntry.name = newName;
        oldEntry.amount = newAmount;

        // persist & re-render
        saveToStorage();
        renderEntries();

        // exit edit mode
        cancelEdit();  // clears fields and resets button
      }

      // --- DELETE entry ---
      function deleteEntry(id) {
        if (!confirm('Delete this entry? amount will be refunded.')) return;

        const index = entries.findIndex(e => e.id === id);
        if (index === -1) return;

        const removed = entries[index];
        // refund amount
        balance = balance + removed.amount;
        balanceShow.innerText = balance;
        balanceInput.value = balance;

        // remove from array
        entries.splice(index, 1);

        // if we were editing this entry, cancel edit mode
        if (editingId === id) {
          cancelEdit();
        }

        saveToStorage();
        renderEntries();
      }

      // optional: set initial balance manually if user types in balanceInput?
      // we don't automatically update because it would break consistency.
      // but we allow the 'set balance' via the input if balance is 0 at time of add.
      // also user might want to force set balance — we add a hidden double-click? No.
      // For clarity, we leave as is (balanceInput shows current, rarely changed manually).

      // but we can sync if user manually changes balanceInput? risky.
      // let's ignore manual changes (it's just a display / initial set when zero)

      // load on start
      window.addEventListener('load', () => {
        loadFromStorage();
      });

      // Expose functions to global for onclick handlers
      window.handleMainAction = handleMainAction;
      window.cancelEdit = cancelEdit;
      window.deleteEntry = deleteEntry;        // not directly used by global onclick now but kept for reference
      window.startEditEntry = startEditEntry;  // not needed globally
    })();
  </script>
</body>
  </html>
